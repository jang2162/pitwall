# 실 DB 시험(live_*)의 실행 개수 하한 — DB 마다 한 줄(14-m3-plan.md M3-01, 결정 M3-D16). `scripts/db-live.mjs` 가 읽는다.
#
# 값은 그 DB 의 필터가 고른 시험 가운데 준비 확인 시험(`live_<db>_ready`)을 뺀 수의 하한이다. 처음 값은 0 이고, 드라이버 행이
# 자기 완료 기준의 N 으로 올린다(M3-06 pg ≥ 10, M3-07 mysql · mariadb ≥ 8, M3-09 redis ≥ 8, M3-22 가 redis 를 13 으로, 그 리뷰 수정 회차가 22 로, M3-11 ssh_tunnel ≥ 6, M3-12 가 그리드 편집 시험으로 pg 를 8, mysql · mariadb 를 9 올렸다).
