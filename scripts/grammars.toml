# 내장 언어 확장(extensions/lang-<id>/)의 tree-sitter 문법 출처표. `node scripts/grammars.mjs` 가 읽고, 해시 줄만 고쳐 쓴다.
#
# 문법은 앱에 네이티브로 링크한다(결정 M1-D2 의 되돌림 — docs/design/12-m1-plan.md §4): 대부분 crates.io 의 문법 크레이트를,
# crates.io 판본을 쓸 수 없는 것은 git 의존성 · 저장소에 넣은 C 소스(crates/pw-syntax 의 build.rs)를 쓴다. 강조 쿼리는 원본
# 저장소의 고정 커밋에서 이어 붙여 `extensions/<extension>/queries/<id>/highlights.scm` 에 쓴다. 손으로 고친 쿼리 · C 소스가 조용히
# 들어오지 않고 크레이트 판본과 이 표가 갈리지 않도록 `check`(`mise run lint`)가 아래 해시와 커밋된 파일, Cargo.lock 을 견준다.
# 받는 법 · 다시 만드는 법은 CONTRIBUTING.md 「tree-sitter 문법」 절.
#
# 키:
#   id          쿼리 폴더 이름(queries/<id>/) · 매니페스트의 `builtin_grammar`(crates/pw-syntax/src/native.rs 의 표). tree-sitter 의
#               문법 이름과 같다
#   extension   extensions/ 아래 확장 폴더
#   repo · tag · commit   원본 저장소와 고정 태그 · 그 커밋(받을 때는 커밋만 쓴다 — 태그는 사람이 읽는 표시다. 태그가 없는 커밋은
#               tag 를 쓰지 않는다)
#   crate · version   crates/pw-syntax 가 의존하는 문법 크레이트와 그 crates.io 판본. version 이 없으면 repo 의 commit 을 rev 로 고정한
#               git 의존성이다
#   vendor      crate 대신: 문법 저장소 src/ 의 C 소스(파서 · 외부 스캐너 · 헤더)와 LICENSE 를 복사해 둔 자리
#   path        저장소 안 문법 폴더(기본 ".")
#   highlights  이어 붙일 쿼리 파일. 같은 노드를 여러 패턴이 잡으면 뒤의 것이 이기므로(crates/pw-syntax/src/highlight.rs) 바탕
#               쿼리를 먼저, 그 위에 덮는 쿼리를 뒤에 둔다. 순서는 원본 저장소의 tree-sitter.json 을 따르되, 그 순서가 바탕을 뒤에
#               두는 곳(typescript · tsx)은 거꾸로 한다. `<다른 id>:<경로>` 는 그 문법 저장소의 파일이다
#   test_wasm   true 면 `tree-sitter build --wasm`(버전은 mise.toml)으로 crates/pw-syntax/tests/wasm/<id>.wasm 을 만든다 — 앱이
#               쓰지 않는 WASM 문법 경로(`pw-syntax` 의 `wasm` 기능, 외부 확장 M8)의 시험 입력(기본 false)
#   license     SPDX. 전문은 저장소의 LICENSE 를 확장 폴더에 복사하고 licenses/vendored.md 에 싣는다
#   highlights_sha256 · vendor_sha256 · wasm_sha256   만든 파일의 SHA-256(스크립트가 쓴다. vendor_sha256 은 파일마다
#               `<경로>\0<SHA-256>\n` 을 이어 붙인 것의 SHA-256)

[[grammar]]
id = "rust"
extension = "lang-rust"
repo = "https://github.com/tree-sitter/tree-sitter-rust"
tag = "v0.24.2"
commit = "77a3747266f4d621d0757825e6b11edcbf991ca5"
crate = "tree-sitter-rust"
version = "0.24.2"
highlights = ["queries/highlights.scm"]
license = "MIT"
highlights_sha256 = "8b86152dab0dbe161aa68a3751495573001a5f0ea5c1021fd4447272f58ae803"

[[grammar]]
id = "typescript"
extension = "lang-typescript"
repo = "https://github.com/tree-sitter/tree-sitter-typescript"
tag = "v0.23.2"
commit = "f975a621f4e7f532fe322e13c4f79495e0a7b2e7"
crate = "tree-sitter-typescript"
version = "0.23.2"
path = "typescript"
# tree-sitter.json 은 ["queries/highlights.scm", JS 의 highlights.scm] 이다 — JS 의 `(identifier) @variable` 이 TS 의 규칙을 덮는다.
highlights = ["javascript:queries/highlights.scm", "queries/highlights.scm"]
license = "MIT"
highlights_sha256 = "fa222f7c12814e89b9574e433fc33e50a16036e7f0536ae5d241cd3ecd759378"

