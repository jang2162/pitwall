# tree-sitter.json 은 [TS, JS 의 highlights-jsx.scm, JS 의 highlights.scm] 이다 — 바탕(JS)을 먼저 둔다(typescript 와 같은 이유).
highlights = [
  "javascript:queries/highlights.scm",
  "javascript:queries/highlights-jsx.scm",
  "queries/highlights.scm",
]
