# cargo-deny 설정. `mise run licenses` 가 부른다.

[graph]
# 비워 두면 모든 타깃의 의존성을 본다. 3 OS 에 배포하므로 좁히지 않는다.
targets = []
all-features = true

[advisories]
# 취약점·관리 중단 공지는 기본값(전부 실패)을 쓴다. 무시할 공지는 ID 와 이유를 함께 적는다.
ignore = [
  # proc-macro-error 관리 중단. Linux 에서 tauri → wry → gtk-rs 0.18 이 끌어온다. 업스트림에 대체가 없다.
  { id = "RUSTSEC-2024-0370", reason = "gtk-rs 0.18 via tauri/wry on Linux; no maintained replacement upstream" },
  # zbus 5 의 하위 크레이트 관리 중단(zbus 6 에 합쳐졌다). Linux 에서 tauri-plugin-opener · tauri-plugin-single-instance →
  # zbus 5 가 끌어온다. 두 플러그인의 최신판(2.x, 3.0 alpha 도)이 zbus ^5.9 다. 플러그인이 zbus 6 으로 옮기면 걷는다.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 from tauri-plugin-opener/single-instance; remove when they move to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 from tauri-plugin-opener/single-instance; remove when they move to zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 from tauri-plugin-opener/single-instance; remove when they move to zbus 6" },
  # zip 4 의 압축 풀기 취약점 3건(SUID 비트 보존 · 대상 밖 심링크 · 심링크를 따라간 권한 적용). tauri-plugin-updater 2.14 가
  # `zip = "4"` 로 묶어 cargo update 로 못 올리고, 같은 `zip` feature 가 macOS 의 .app.tar.gz 에 필요한 tar · flate2 도 켜서
  # 끌 수도 없다. 무시하는 이유: ① zip 은 updater 의 Windows 전용 의존성이다. ② `ZipArchive` 는 minisign 서명 검증을 통과한
  # 바이트에만 돈다(updater.rs `install` 이 `verify` 뒤에 `install_inner` 를 부른다). ③ 우리 Windows 산출물은 zip 이 아닌
  # raw .msi 라, 이 경로를 타려면 우리 키로 서명된 악성 zip 이 있어야 한다. 플러그인이 zip ≥9 로 옮기면 걷는다.
  { id = "RUSTSEC-2026-0367", reason = "zip 4 via tauri-plugin-updater (Windows only, extracts only signature-verified bytes, we ship raw msi); remove when the plugin moves to zip >= 9" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 via tauri-plugin-updater (Windows only, extracts only signature-verified bytes, we ship raw msi); remove when the plugin moves to zip >= 9" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 via tauri-plugin-updater (Windows only, extracts only signature-verified bytes, we ship raw msi); remove when the plugin moves to zip >= 9" },
]
# 업스트림이 고쳐 ignore 가 낡으면 경고로 드러낸다.
unused-ignored-advisory = "warn"

[licenses]
# 허용 라이선스의 정본이다. MIT 프로젝트이므로 허용형만 둔다(docs/design/02-tech-stack.md 「라이선스 검사」 행).
# scripts/licenses.mjs 가 이 목록을 읽어 npm 의존성도 검사하고, about.toml 의 accepted 와 같은지도 검사한다.
# 그 스크립트는 좁은 TOML 파서로 읽는다 — 표는 `[[licenses.exceptions]]` 처럼 표 머리로 쓰고 인라인 표로 바꾸지 않는다.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "BlueOak-1.0.0",
  # argparse(npm, ruler 의 전이 의존성)가 쓴다. PSF 계열 허용형이다.
  "Python-2.0",
]
confidence-threshold = 0.9
# 목록은 npm 과 함께 쓰므로 Rust 쪽에서 안 쓰이는 항목이 있는 것이 정상이다.
unused-allowed-license = "allow"
# Tauri 를 올려 아래 예외 크레이트가 트리에서 빠지면 경고로 드러낸다. 그때 예외와 about.toml 을 함께 걷는다.
unused-license-exception = "warn"

# MPL-2.0 은 파일 단위 약한 copyleft 라 전역 allow 에 넣지 않는다. Tauri 의 전이 의존성에 한해, 수정 없이 쓰는
# 조건으로 크레이트 단위로만 허용한다(docs/design/02-tech-stack.md 「라이선스 검사」 행).
# about.toml 의 크레이트별 accepted 와 같아야 한다 — 다르면 `mise run licenses` 가 실패한다.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

# CC0-1.0 은 퍼블릭 도메인 헌정이라 고지 · 소스 공개 의무가 없지만, 허용형 목록의 성격(저작권 라이선스)과 달라 전역 allow 에
# 넣지 않는다. 설계가 파일 감시로 지정한 notify(docs/design/02-tech-stack.md 「파일 감시」 · 「라이선스 검사」 행)에 한해 허용한다.
# about.toml 의 [notify] accepted 와 같아야 한다.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

# BSL-1.0(Boost)은 허용형이고 바이너리 배포에는 고지 의무도 없지만, 목록을 넓히지 않으려고 전역 allow 에 넣지 않는다.
# 클립보드 플러그인(tauri-plugin-clipboard-manager → arboard)의 Windows 전용 전이 의존성 두 개에 한해 크레이트 단위로 허용한다.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# CDLA-Permissive-2.0(데이터용 허용형)은 전역 allow 에 넣지 않는다. 자동 업데이트(tauri-plugin-updater → reqwest →
# rustls-platform-verifier)가 끌어오는 webpki-root-certs 는 wasm32 전용 의존성이라 배포하는 3 OS 바이너리에 들어가지 않는다
# (`cargo tree -e normal -i webpki-root-certs --target <배포 타깃>` 이 비어 있다). [graph] targets = [] 가 모든 타깃을 봐서
# 걸릴 뿐이다. 배포 타깃의 그래프에 들어오면 이 예외를 걷고 다시 판단한다. about.toml 의 [webpki-root-certs] 와 같아야 한다.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# publish = false 인 우리 크레이트도 검사한다. 워크스페이스 라이선스(MIT)가 목록에서 빠지면 바로 실패한다.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 path 의존성은 버전이 없어도 와일드카드로 보지 않는다.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Kotlin 문법: crates.io 판본(0.3.8)이 옛 tree-sitter 크레이트(links = "tree-sitter")에 직접 의존해 tree-sitter 0.27 과 한 빌드에
# 들어가지 못해, tree-sitter-language 로 바꾼 커밋을 rev 로 고정해 받는다(crates/pw-syntax/Cargo.toml · scripts/grammars.toml).
# crates.io 에 0.4 이상이 올라오면 그쪽으로 옮기고 이 줄을 뺀다.
allow-git = ["https://github.com/fwcd/tree-sitter-kotlin"]
