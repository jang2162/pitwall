# cargo-deny 설정. `mise run licenses` 가 부른다.

[graph]
# 비워 두면 모든 타깃의 의존성을 본다. 3 OS 에 배포하므로 좁히지 않는다.
targets = []
all-features = true

[advisories]
# 취약점·관리 중단 공지는 기본값(전부 실패)을 쓴다. 무시할 공지는 ID 와 이유를 함께 적는다.
ignore = [
  # proc-macro-error 관리 중단. Linux 에서 tauri → wry → gtk-rs 0.18 이 끌어온다. 업스트림에 대체가 없다.
  { id = "RUSTSEC-2024-0370", reason = "gtk-rs 0.18 via tauri/wry on Linux; no maintained replacement upstream" },
]
# 업스트림이 고쳐 ignore 가 낡으면 경고로 드러낸다.
unused-ignored-advisory = "warn"

[licenses]
# 허용 라이선스의 정본이다. MIT 프로젝트이므로 허용형만 둔다(docs/design/02-tech-stack.md 「라이선스 검사」 행).
# scripts/licenses.mjs 가 이 목록을 읽어 npm 의존성도 검사하고, about.toml 의 accepted 와 같은지도 검사한다.
# 그 스크립트는 좁은 TOML 파서로 읽는다 — 표는 `[[licenses.exceptions]]` 처럼 표 머리로 쓰고 인라인 표로 바꾸지 않는다.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "BlueOak-1.0.0",
  # argparse(npm, ruler 의 전이 의존성)가 쓴다. PSF 계열 허용형이다.
  "Python-2.0",
]
confidence-threshold = 0.9
# 목록은 npm 과 함께 쓰므로 Rust 쪽에서 안 쓰이는 항목이 있는 것이 정상이다.
unused-allowed-license = "allow"
# Tauri 를 올려 아래 예외 크레이트가 트리에서 빠지면 경고로 드러낸다. 그때 예외와 about.toml 을 함께 걷는다.
unused-license-exception = "warn"

# MPL-2.0 은 파일 단위 약한 copyleft 라 전역 allow 에 넣지 않는다. Tauri 의 전이 의존성에 한해, 수정 없이 쓰는
# 조건으로 크레이트 단위로만 허용한다(docs/design/02-tech-stack.md 「라이선스 검사」 행).
# about.toml 의 크레이트별 accepted 와 같아야 한다 — 다르면 `mise run licenses` 가 실패한다.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

# CC0-1.0 은 퍼블릭 도메인 헌정이라 고지 · 소스 공개 의무가 없지만, 허용형 목록의 성격(저작권 라이선스)과 달라 전역 allow 에
# 넣지 않는다. 설계가 파일 감시로 지정한 notify(docs/design/02-tech-stack.md 「파일 감시」 · 「라이선스 검사」 행)에 한해 허용한다.
# about.toml 의 [notify] accepted 와 같아야 한다.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

# BSL-1.0(Boost)은 허용형이고 바이너리 배포에는 고지 의무도 없지만, 목록을 넓히지 않으려고 전역 allow 에 넣지 않는다.
# 클립보드 플러그인(tauri-plugin-clipboard-manager → arboard)의 Windows 전용 전이 의존성 두 개에 한해 크레이트 단위로 허용한다.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

[licenses.private]
# publish = false 인 우리 크레이트도 검사한다. 워크스페이스 라이선스(MIT)가 목록에서 빠지면 바로 실패한다.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 path 의존성은 버전이 없어도 와일드카드로 보지 않는다.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
