[package]
name = "pw-tools"
description = "Pitwall tools: the Mason registry data (pinned version, built-in snapshot, overrides) and the tool installer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pw-core = { path = "../pw-core" }
# 설치본 찾기(`ToolLocator`)를 구현한다(M4-02 의 trait).
pw-lsp-servers = { path = "../pw-lsp-servers" }
pw-rpc = { path = "../pw-rpc" }
# npm · python 을 런타임 환경에서 찾는다(결정 M4-D6).
pw-runtime = { path = "../pw-runtime" }
# registry 받기(15-m4-plan.md M4-03 ① — M4-04 의 설치기가 같은 받기 모듈을 넓힌다). 데스크톱의 업데이트 확인과 같은 판 · TLS
# 구성(rustls, 암호 제공자는 ring)이라 크레이트가 늘지 않는다. 첫 요청 전에 ring 제공자를 기본으로 건다.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10.9"
specta = { workspace = true, features = ["derive"] }
# 설치 받기 · npm · pip 실행(`process` — 작업을 취소하면 프로세스를 죽인다).
tokio = { workspace = true, features = [
  "rt",
  "fs",
  "sync",
  "time",
  "process",
  "io-util",
  "macros",
] }
# registry.toml · 덮어쓰기 정의를 읽는다. 버전은 pw-core 와 같게 둔다.
toml_edit = "0.25.17"
tracing = "0.1.44"
# 받을 주소의 형식 검사(https 만 — 결정 M4-D17). reqwest 가 이미 쓰는 판이다.
url = "2.5.8"
# registry 릴리스 산출물 `registry.json.zip` · 도구 .zip 을 푼다. deflate 만 켠다. 9 미만은 RUSTSEC-2026-0429 가 걸린다(데스크톱
# 업데이터는 아직 zip 4 를 따로 끌어온다 — deny.toml).
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"] }
# 설치기가 `.tar.gz` 를 푼다(M4-04). 데스크톱 업데이터가 이미 쓰는 판이다 — 기본 기능(xattr)은 켜지 않는다.
tar = { version = "0.4.46", default-features = false }
# zip 의 deflate 백엔드(기본 `rust_backend` — miniz_oxide). zip 9 는 flate2 를 기본 기능 없이 끌어오므로 여기서 켠다. 데스크톱
# 업데이터 · tar 가 이미 쓰는 판이다.
flate2 = "1.1.10"

[dev-dependencies]
tempfile = "3.27.0"
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
