# 설치 전 확인 다이얼로그에 보일 라이선스를 Mason 정의(`licenses`) 대신 정하는 표(15-m4-plan.md M4-04 ⑤).
#
# Mason 정의가 배포물의 라이선스를 다 말하지 않는 패키지만 적는다. 값은 SPDX 식별자이거나 `LicenseRef-` 로 시작하는 이름이고,
# 화면(M4-17)이 `LicenseRef-` 이름을 사람의 글로 옮긴다. 확인 기록(`$STATE/tools/consent.json`)은 이 값으로 견주므로, 값을 바꾸면
# 그 패키지를 다시 묻는다. 고칠 때는 `checked`(확인한 날)와 `source`(근거)를 함께 고친다.

# Mason 정의는 `Apache-2.0` 으로만 적지만, 저장소 README 는 배포물이 IntelliJ IDEA 와 JetBrains Air · Fleet 의 독점 부분에 기반해
# 일부 비공개(partially closed-source)라고 밝힌다. 저장소의 LICENSE 는 Apache-2.0 이다.
[kotlin-lsp]
licenses = ["Apache-2.0", "LicenseRef-JetBrains-proprietary-components"]
note = "Apache-2.0 (repository) + JetBrains proprietary components in the distribution"
source = "https://github.com/Kotlin/kotlin-lsp/blob/main/README.md"
checked = "2026-11-02"
