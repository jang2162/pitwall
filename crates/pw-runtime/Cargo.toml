[package]
name = "pw-runtime"
description = "Pitwall runtime environment: the environment for processes the app launches, from the login shell and runtime providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pw-core = { path = "../pw-core" }
pw-rpc = { path = "../pw-rpc" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
# RPC 핸들러가 셸 기다리기를 블로킹 스레드로 보낸다.
tokio = { workspace = true, features = ["rt"] }
tracing = "0.1.44"

[target."cfg(unix)".dependencies]
# setsid(2) · killpg(2) · getpwuid_r(3). 버전은 데스크톱 크레이트와 같게 둔다.
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
