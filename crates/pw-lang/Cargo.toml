[package]
name = "pw-lang"
description = "Pitwall language detection: GitHub Linguist data, .gitattributes linguist attributes, vendored/generated/documentation files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# gix-attributes 가 경로를 이 타입으로 받는다. gix-attributes 가 쓰는 버전과 같게 둔다.
bstr = "1.13.1"
# `.gitattributes` 의 linguist 속성(결정 M1-D20). 매크로 · 우선순위 규칙을 git 과 같게 푼다.
gix-attributes = "0.37.0"
pw-core = { path = "../pw-core" }
pw-ext = { path = "../pw-ext" }
pw-rpc = { path = "../pw-rpc" }
# heuristics · vendor · documentation 정규식. 빌드 스크립트가 같은 크레이트로 옮길 수 있는지 미리 본다(build-dependencies).
regex = "1.13.1"
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
# `.gitattributes` 읽기(파일 IO)를 블로킹 스레드로 보낸다.
tokio = { workspace = true, features = ["rt"] }
tracing = "0.1.44"

[build-dependencies]
regex = "1.13.1"
# Linguist YAML 을 빌드 때 표로 바꾼다. 앱 바이너리에는 들어가지 않는다.
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "macros"] }
