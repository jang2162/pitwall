[package]
name = "pw-fs"
description = "Pitwall file system service: listing, stat, ranged reads, atomic writes and watching inside the project roots"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 바이너리 내용은 JSON 으로 base64 로 실어 보낸다. 버전은 Tauri 트리의 것과 같게 둔다(크레이트가 늘지 않는다).
base64 = "0.22.1"
# UTF-8 이 아닌 텍스트의 인코딩 짐작(M1-23, 결정 M1-D12 — Apache-2.0 OR MIT). 짐작한 인코딩으로 푸는 것은 `encoding_rs` 다.
chardetng = "1.0.0"
# 짐작한 인코딩 · UTF-16 BOM 의 텍스트를 UTF-8 로 푼다(M1-23, (Apache-2.0 OR MIT) AND BSD-3-Clause). 버전은 `grep-searcher` 가 쓰는 것과 같게 둔다.
encoding_rs = "0.8.35"
# 파일 목록 인덱스의 퍼지 매칭 `search.files`(M1-12, 결정 M1-D4 — MIT, SIMD Smith-Waterman). 의존성이 없다(`serde` 는 기능을 켤 때만).
frizbee = "0.13.0"
# `search.text`(M1-07, 결정 M1-D6): ripgrep 의 검색 라이브러리(모두 Unlicense OR MIT). `grep-matcher` 는 한 줄 안의 일치 범위를 찾는
# `Matcher` 트레이트다.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# 기능만 켠다: `parallel` 이면 `gix-attributes` 의 속성 이름이 `Rc` 대신 `Arc` 라 `pw_lang::attributes::RepoAttributes` 를 검색 스레드끼리
# 나눌 수 있다(`search.rs` 의 폴더별 속성 캐시). 버전은 `gix-attributes` 가 쓰는 것과 같게 둔다.
gix-parallel = { version = "0.50.0", features = ["parallel"] }
# .gitignore · .ignore · 전역 gitignore 판정(ripgrep 과 같은 규칙, Unlicense OR MIT). M1-07 · M1-12 도 같은 크레이트를 쓴다.
ignore = "0.4.33"
# 파일 감시(src/watch). pw-core 의 설정 감시와 같은 버전이다.
notify = "8.2.0"
pw-core = { path = "../pw-core" }
# `search.text` 의 벤더 · 생성 파일 제외(M1-02 의 경로 규칙과 `.gitattributes`).
pw-lang = { path = "../pw-lang" }
pw-rpc = { path = "../pw-rpc" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `version` 의 내용 해시. 버전은 Tauri 트리의 것과 같게 둔다.
sha2 = "0.10.9"
specta = { workspace = true, features = ["derive"] }
# 디스크 IO 를 블로킹 스레드로 보낸다. `sync` 는 `fs.watch` 스트림이 감시 방식의 바뀜을 기다리는 것과 동시 검색 수 상한(`search.rs` 의
# 세마포어), `time` 은 그 대기 시간이다.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# 파일 목록 인덱스의 빌드 작업(`pw_core::TaskSpawner::scoped`)에 넘기는 취소 토큰. 버전은 워크스페이스의 것이다.
tokio-util = { workspace = true }
# 감시 오류 · 한도 초과를 로그에 남긴다. 버전은 pw-runtime 과 같게 둔다.
tracing = "0.1.44"
# 삭제 → OS 휴지통(`fs.trash`, M1-21, MIT). 기본 기능 그대로: Windows 의 COM 초기화(`coinit_apartmentthreaded`)와 Linux 휴지통의
# 지운 시각(`chrono`). macOS 는 Finder 를 부르지 않는 `NsFileManager` 방식으로 고른다(src/ops.rs).
trash = "5.2.9"

[target."cfg(unix)".dependencies]
# access(2) 로 실제 쓰기 가능 여부를 보고, 덮지 않는 rename(macOS `renamex_np` · Linux `renameat2`, src/ops.rs)을 부른다. 버전은 pw-open-with · 데스크톱 크레이트와 같게 둔다.
libc = "0.2.190"

[target."cfg(windows)".dependencies]
# 연 파일 핸들의 실제 경로(GetFinalPathNameByHandleW, src/handle.rs). 버전은 Tauri 트리의 것과 같게 둔다.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
