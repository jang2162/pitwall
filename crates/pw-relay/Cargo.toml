[package]
name = "pw-relay"
description = "Pitwall relay daemon: the per-user socket on a remote machine, relay.toml, idle exit and the stdio proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 직접 연결의 듣는 주소(18-m7-plan M7-24 ② — 인터페이스 주소 목록). mdns-sd 가 쓰는 판과 같다.
if-addrs = "0.15.0"
# LAN 검색 광고(18-m7-plan M7-24 ③ · 메인 판정 M7-P14). 광고에는 무작위 이름 · 포트 · 링크 프로토콜 판만 싣는다(`pw_relay::advertise`).
mdns-sd = { version = "0.22.0", default-features = false }
# 광고의 무작위 표지(pw-link 와 같은 판).
getrandom = "0.4.3"
# 소켓 자격(uid) · 잠금 파일(flock) · 새 세션(setsid).
libc = "0.2.190"
pw-core = { path = "../pw-core" }
pw-db = { path = "../pw-db" }
pw-diag = { path = "../pw-diag" }
pw-ext = { path = "../pw-ext" }
pw-fs = { path = "../pw-fs" }
pw-git = { path = "../pw-git" }
# Relay 의 Host 는 Desktop 과 같은 조립이다(18-m7-plan M7-01 · M7-04).
pw-host = { path = "../pw-host" }
pw-i18n = { path = "../pw-i18n" }
pw-link = { path = "../pw-link" }
# 소켓 규칙(폴더 0700 · 상대 uid)은 MCP 로컬 소켓과 같다(`pw_mcp::socket`).
pw-mcp = { path = "../pw-mcp" }
pw-open-with = { path = "../pw-open-with" }
pw-rpc = { path = "../pw-rpc" }
semver = "1.0.28"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "io-util",
  "io-std",
  "net",
  "signal",
  "process",
] }
tokio-util = { workspace = true }
toml_edit = "0.25.17"
tracing = "0.1.44"
# 대기 코드를 메모리에서 지운다(M7-23 — pw-link 와 같은 판).
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
# 코드가 로그에 실리지 않는지 본다(M7-23).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "io-util",
  "net",
  "test-util",
] }
