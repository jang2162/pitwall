[package]
name = "pw-run"
description = "Pitwall run: PTY terminal sessions and run configurations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 출력 청크(PTY 의 바이트)를 JSON 문자열로 잃지 않고 보낸다.
base64 = "0.23.1"
# 결정 M1-D14(docs/design/12-m1-plan.md §4). wezterm 저장소 안의 크레이트라 릴리스가 드물다.
portable-pty = "0.9.0"
pw-core = { path = "../pw-core" }
# `.env` 파일을 루트 안 판정 · 연 핸들 재판정으로 읽는다(17-m6-plan M6-03 ② — `scope::Roots::readable` · `open_inside`).
pw-fs = { path = "../pw-fs" }
pw-rpc = { path = "../pw-rpc" }
pw-runtime = { path = "../pw-runtime" }
# 태스크 감지(M6-05)가 maven 의 effective POM 에서 플러그인 goal 을 읽는다(DTD · 엔티티를 펼치지 않는다). 다른 의존이 이미 쓰는 판.
quick-xml = "0.42.0"
# `run_logs` 의 `grep`(17-m6-plan M6-12 ③ — 크기 상한을 건 정규식). pw-git · pw-lang 과 같은 버전.
regex = "1.13.1"
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 「사람이 본 구성」 해시(M6-11)의 `.env` 파일 내용 해시와 태스크 감지의 `Makefile` · `justfile` 정의 본문(파일 전체의 해시 —
# detect/mod.rs `file_definition`). pw-core 와 같은 버전.
sha2 = "0.10.9"
specta = { workspace = true, features = ["derive"] }
# 실행 구성 파일을 고칠 때 주석 · 모르는 키를 지킨다(pw-core 의 설정 쓰기와 같은 버전).
toml_edit = "0.25.17"
# 태스크 감지(17-m6-plan M6-05)가 `mvn help:effective-pom` 의 출력을 받는 임시 폴더(0700, 이름 무작위). 셸 통합(integration.rs)도 쓴다.
tempfile = "3.27.0"
# 셸 띄우기 · 레지스트리 읽기를 블로킹 스레드로 보내고, 출력 · 종료를 기다린다.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
# 「태스크 읽기」(M6-05)를 프로젝트 범위 Host 작업으로 띄울 때 그 취소 토큰(pw-core 의 Task 와 같은 것).
tokio-util = { workspace = true }
# 태스크 감지(17-m6-plan M6-04)가 compose 파일을 이벤트로만 읽는다(별칭을 펼치지 않는다 — detect/compose.rs). pw-lang 과 같은 버전.
yaml-rust2 = "0.13.0"

[target."cfg(unix)".dependencies]
# 세션의 프로세스 찾기(getsid · proc_listallpids)와 신호. 버전은 데스크톱 크레이트와 같게 둔다.
libc = "0.2.190"

[dev-dependencies]
# 실행 구성 JSON Schema 스냅숏(17-m6-plan M6-01 ⑦).
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
