[package]
name = "pw-db"
description = "Pitwall DB core: driver registry, connections and sessions, execution pipeline and gate, schema cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# 실 DB 시험 표지(`cfg(pw_live_*)`) — 관문을 지나는 live 시험(M3-12 · M3-22)이 여기 산다. pw-db-driver 와 같은 빌드 스크립트.
build = "../pw-db-driver/live_cfg.rs"

# 드라이버 크레이트(pw-db-driver-*)에 의존하지 않는다 — trait 로만 부른다(14-m3-plan.md 결정 M3-D3). 드라이버는 데스크톱
# 크레이트가 등록부에 넣는다. `tests/driver_free.rs` 가 지킨다.
[dependencies]
# 비밀마다 키체인 항목 하나(14-m3-plan.md 결정 M3-D12). 기본 기능(`v1`)이 macOS Keychain · Windows Credential Manager ·
# Secret Service(zbus — 순수 Rust, 시스템 libdbus 에 링크하지 않는다)를 고른다.
keyring = "4.2.0"
pw-core = { path = "../pw-core" }
pw-db-driver = { path = "../pw-db-driver" }
# 실행 관문의 문장 나누기 · 위험도 분류 · 트랜잭션 제어 가려내기(M3-03 · M3-04 · M3-05).
pw-db-sql = { path = "../pw-db-sql" }
pw-db-types = { path = "../pw-db-types" }
pw-rpc = { path = "../pw-rpc" }
pw-runtime = { path = "../pw-runtime" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 실행 관문의 확인 해시(세션 · 방언 · 문장 원문에 묶는다 — 결정 M3-D20). pw-fs 와 같은 판.
sha2 = "0.10.9"
specta = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
# 연결 설정 파일을 쓸 때 사람이 단 주석 · 모르는 키 순서를 지킨다(pw-core 의 설정 마이그레이션과 같은 판).
toml_edit = "0.25.17"
tracing = "0.1.44"

[dev-dependencies]
# 비밀 값이 로그 파일에 없는지 앱과 같은 로그 구독자로 본다(tests/secret_log.rs).
pw-diag = { path = "../pw-diag" }
tempfile = "3.27.0"
pw-db-driver = { path = "../pw-db-driver", features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
