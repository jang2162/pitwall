[package]
name = "pw-rpc-gen"
description = "Generates TypeScript types and JSON Schema from pw-rpc method declarations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 메서드를 선언한 크레이트. 여기 더하고 src/main.rs 에 `use <크레이트> as _;` 도 더한다.
pw-core = { path = "../pw-core" }
pw-diag = { path = "../pw-diag" }
pw-ext = { path = "../pw-ext" }
pw-rpc = { path = "../pw-rpc" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
