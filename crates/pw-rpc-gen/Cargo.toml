[package]
name = "pw-rpc-gen"
description = "Generates TypeScript types and JSON Schema from pw-rpc method declarations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 메서드를 선언하거나 `rpc_type!` 으로 타입을 등록한 크레이트. 여기 더하고 src/main.rs 에 `use <크레이트> as _;` 도 더한다.
pw-core = { path = "../pw-core" }
# DB 계층(14-m3-plan.md M3-01): 타입을 등록하는 pw-db-types, 메서드를 선언할 pw-db-sql(M3-04) · pw-db(M3-02 이후).
# 드라이버 크레이트는 RPC 를 선언하지 않는다 — 선언하게 되면 그 행이 여기 더한다.
pw-db = { path = "../pw-db" }
pw-db-sql = { path = "../pw-db-sql" }
pw-db-types = { path = "../pw-db-types" }
pw-diag = { path = "../pw-diag" }
pw-ext = { path = "../pw-ext" }
pw-fs = { path = "../pw-fs" }
pw-git = { path = "../pw-git" }
pw-i18n = { path = "../pw-i18n" }
# 심볼 인덱스(15-m4-plan.md M4-15): `index.*`.
pw-index = { path = "../pw-index" }
pw-lang = { path = "../pw-lang" }
# LSP(15-m4-plan.md M4-01). 이 행의 RPC 는 아직 없다 — M4-05 이후 행이 선언을 더할 때 겹치지 않게 미리 둔다.
pw-lsp = { path = "../pw-lsp" }
pw-lsp-servers = { path = "../pw-lsp-servers" }
pw-open-with = { path = "../pw-open-with" }
pw-rpc = { path = "../pw-rpc" }
pw-run = { path = "../pw-run" }
pw-runtime = { path = "../pw-runtime" }
pw-syntax = { path = "../pw-syntax" }
pw-tools = { path = "../pw-tools" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
