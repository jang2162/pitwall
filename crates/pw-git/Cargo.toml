[package]
name = "pw-git"
description = "Pitwall git backend: repository resolution and reads with gitoxide, writes through the git CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 시험 저장소 도우미(`testing`)를 다른 크레이트의 시험에도 연다. 이 크레이트의 시험은 기능 없이도 쓴다.
test-support = ["dep:tempfile"]

[dependencies]
# 로그 커밋의 `encoding` 헤더를 UTF-8 로(`log::commit`). 버전은 pw-fs 와 같게 둔다.
encoding_rs = "0.8.35"
# 읽기(결정 M2-D1). 기본 기능을 끄고 쓰는 것만 켠다 — 네트워크 · credentials 는 켜지 않는다(fetch · push 는 CLI).
# 이미 들어와 있는 `gix-attributes`(pw-lang) · `gix-parallel`(pw-fs)과 같은 gitoxide 릴리스다. 올릴 때 셋을 함께 올린다.
# `status`: 작업 트리 상태(M2-02, `src/status`). `parallel`: status 의 index↔작업 트리 비교 · 디렉터리 걷기를 스레드로 나누고 중간에
# 멈출 수 있게 한다(없으면 결과를 다 모은 뒤에야 돌려주고 멈추지 못한다). `mailmap`: 로그의 작성자(`log::commit`).
gix = { version = "0.90.0", default-features = false, features = [
  "sha1",
  "blob-diff",
  "revision",
  "status",
  "parallel",
  "mailmap",
] }
# git 디렉터리 감시(M2-02, `src/watch`). 버전은 pw-fs · pw-core 와 같다.
notify = "8.2.0"
pw-core = { path = "../pw-core" }
# `git.blob` 의 판정 · 내용(`fs.read` 와 같은 꼴)과 대용량 기준값(결정 M1-D9). 작업 트리 변경은 M1-06 의 `fs.changed` 를 받아
# 따른다(`src/watch`) — 그 토픽 · 내용 타입 · 디바운스 창을 쓴다.
pw-fs = { path = "../pw-fs" }
# 생성 파일 판정(M1-02, 결정 M1-D20 대안 ①).
pw-lang = { path = "../pw-lang" }
pw-rpc = { path = "../pw-rpc" }
pw-runtime = { path = "../pw-runtime" }
# 로그 필터의 작성자 · 메시지 패턴(`log::filter`). 버전은 pw-lang · pw-diag 와 같게 둔다.
regex = "1.13.1"
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
tempfile = { version = "3.27.0", optional = true }
# git CLI 실행(취소 · 출력 수집 · stdin), RPC 핸들러의 블로킹 스레드, 쓰기 잠금 · 창 질의 · 감시(`src/watch`)의 상태
# 채널(sync), askpass 소켓(net).
tokio = { workspace = true, features = [
  "rt",
  "process",
  "io-util",
  "time",
  "macros",
  "sync",
  "net",
] }
tokio-util = { workspace = true }
tracing = "0.1.44"

[target."cfg(unix)".dependencies]
# setsid(2) · killpg(2). 버전은 데스크톱 크레이트와 같게 둔다.
libc = "0.2.190"

[target."cfg(windows)".dependencies]
# git 을 Job Object 에 넣어 취소 때 프로세스 트리째 끝내고, 콘솔 창 없이 띄운다(`CREATE_NO_WINDOW`). 버전은 pw-fs 와 같게 둔다.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# 레인 배치 스냅숏(`log::tests::graph`). 버전은 pw-syntax 와 같게 둔다.
insta = "1.49.0"
tempfile = "3.27.0"
# test-util: 질문 시간 제한을 멈춘 시계로 본다(`start_paused`).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }

[[example]]
# 10만 커밋 합성 저장소(`docs/design/13-m2-plan.md` M2-03). 생성기는 `testing::synth` 에 있다.
name = "synth_history"
required-features = ["test-support"]

[[example]]
# 합성 저장소에서 `git.log` 첫 청크 · 전체 배치 시간을 잰다(release).
name = "log_timing"
