[package]
name = "pw-core"
description = "Pitwall core: projects, workspaces, event bus, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
etcetera = "0.11.0"
# 저장소 안의 개인 설정 파일(`*.local.toml`)이 git 추적 파일인가(`config::tracked` — 커밋된 파일은 사람의 설정으로 받지 않는다).
# 인덱스만 읽는다. pw-git 의 `gix` 와 같은 gitoxide 릴리스다(그 `gix` 가 요구하는 버전) — pw-lang 의 `gix-attributes` · pw-fs 의
# `gix-parallel` 과 함께 올린다. pw-git 이 이 크레이트에 의존하므로 판정을 pw-git 에 둘 수 없다.
gix-index = { version = "0.58.0", features = ["sha1"] }
# 인덱스에 없는 개인 파일의 내용이 객체 DB 에 있는가(`config::tracked` — checkout 이 실패해 인덱스에 오르지 못한 커밋된 파일).
# `gix-index` 와 같은 gitoxide 릴리스(pw-git 의 `gix` 가 요구하는 판)다 — 함께 올린다.
gix-object = { version = "0.66.1", features = ["sha1"] }
gix-odb = { version = "0.87.0", features = ["sha1"] }
notify = "8.2.0"
pw-rpc = { path = "../pw-rpc" }
# 프로젝트 레지스트리 `$DATA/state.db`. bundled: 시스템 SQLite 버전 차이(OS · 배포판)에 기대지 않는다.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 메서드 입출력 타입은 TS 타입(specta)과 JSON Schema(schemars)를 함께 derive 한다(pw-rpc 의 Method 경계).
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 툴 계획의 승인 해시(registry::plan — 결정 M5-D30).
sha2 = "0.10.9"
specta = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = { workspace = true }
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.27.0"
# rt-multi-thread: 파일 감시 테스트가 감시 스레드와 작업을 함께 돌린다.
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "test-util",
] }
