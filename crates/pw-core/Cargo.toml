[package]
name = "pw-core"
description = "Pitwall core: projects, workspaces, event bus, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
etcetera = "0.11.0"
notify = "8.2.0"
pw-rpc = { path = "../pw-rpc" }
# 메서드 입출력 타입은 TS 타입(specta)과 JSON Schema(schemars)를 함께 derive 한다(pw-rpc 의 Method 경계).
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = { workspace = true }
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.27.0"
# rt-multi-thread: 파일 감시 테스트가 감시 스레드와 작업을 함께 돌린다.
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "test-util",
] }
