[package]
name = "pw-db-driver-sqlite"
description = "Pitwall SQLite driver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# SQLite 픽스처(`fixture` — 임시 파일 · 인메모리 DB 와 픽스처 스키마)를 다른 크레이트의 시험에도 연다.
test-support = ["dep:rusqlite", "dep:tempfile"]

# 드라이버 구현과 그 의존성은 M3-08 이 채운다. rusqlite 는 로컬 저장소(pw-core)와 같은 판이다(결정 M3-D2).
[dependencies]
pw-db-driver = { path = "../pw-db-driver" }
pw-db-types = { path = "../pw-db-types" }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
pw-db-driver = { path = "../pw-db-driver", features = ["test-support"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
