[package]
name = "pw-db-driver"
description = "Pitwall DB driver contract: the driver traits and capability flags, execution budget, cancellation and TLS planning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# 실 DB 시험 표지(`cfg(pw_live_pg)` 등)를 환경 변수에서 정한다. 드라이버 크레이트 넷도 같은 파일을 쓴다 — 머리 주석.
build = "live_cfg.rs"

[features]
# 가짜 드라이버(`fake`)와 실 DB 시험 도우미(`live`)를 다른 크레이트의 시험에도 연다. 이 크레이트의 시험은 기능 없이도 쓴다.
test-support = []

[dependencies]
pw-db-types = { path = "../pw-db-types" }
# 터널의 ssh 를 프로세스 수명 동안 사는 전용 스레드에서 fork 한다(Linux `PR_SET_PDEATHSIG` 는 fork 한 스레드에 묶인다 — `tunnel`).
pw-spawn = { path = "../pw-spawn" }
# 예산(시간 상한)과 취소를 기다린다. 드라이버마다 같은 런타임을 쓴다. `process` · `net` · `io-util` 은 SSH 터널(`tunnel` — ssh 를
# 띄우고 로컬 포트를 찔러 본다, M3-11).
tokio = { workspace = true, features = [
  "rt",
  "sync",
  "macros",
  "time",
  "process",
  "net",
  "io-util",
] }
# 실행 하나의 취소 토큰.
tokio-util = { workspace = true }
# 터널을 띄우고 끝낸 것을 남긴다(`target: "pw_db"`).
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
# 터널의 ssh 를 자기 세션 · 프로세스 그룹으로 띄우고(`setsid`) 그룹째 끝낸다(`killpg`). 판은 pw-runtime 과 같다.
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# 터널의 로컬 포트를 LISTEN 하는 프로세스(`GetExtendedTcpTable`)와, 앱이 강제로 끝나 남은 ssh 를 알아보는 시작 시각
# (`GetProcessTimes`) · 명령줄(`NtQueryInformationProcess`). 판은 pw-fs · pw-git 과 같다.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Threading",
  "Wdk_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "test-util"] }
