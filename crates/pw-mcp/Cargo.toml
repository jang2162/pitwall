[package]
name = "pw-mcp"
description = "Pitwall MCP server: tools generated from RPC declarations, exposure settings, tier policy, audit log, local socket transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pw-core = { path = "../pw-core" }
pw-rpc = { path = "../pw-rpc" }
# MCP 서버. 툴은 손으로 등록하지 않고 RPC 선언에서 만든다 — `#[tool]` 매크로(macros)는 쓰지 않는다.
# transport-async-rw: stdio · 로컬 소켓 모두 AsyncRead/AsyncWrite 쌍으로 넘긴다.
# `client`: `pitwall tool` 의 몸통(`cli` — Desktop 과 Relay 가 함께 쓴다).
rmcp = { version = "3.9.0", default-features = false, features = ["client", "server", "transport-async-rw"] }
# 감사 로그 `$STATE/mcp/audit.db`. 버전 · 기능은 pw-core 와 같게 둔다.
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `mcp.*` RPC(methods.rs)의 입출력 타입이 TS 로 나간다(`rpc_method!` 가 specta 타입을 요구한다).
specta = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "sync",
  "macros",
  "time",
  "io-util",
  "io-std",
  "net",
  # `cli::interrupted` — `pitwall tool` 이 Ctrl+C 로 호출을 거둔다.
  "signal",
] }
tokio-util = { workspace = true }
tracing = "0.1.44"
# 설정 창 「MCP」 쪽의 쓰기(settings.rs)가 `pw_core::config::write::write_key` 에 넘기는 값. 판은 pw-core 와 같게 둔다.
toml_edit = "0.25.17"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[dev-dependencies]
rmcp = { version = "3.9.0", default-features = false, features = [
  "client",
  "server",
  "transport-async-rw",
] }
tempfile = "3.27.0"
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "io-util",
  "net",
  "test-util",
] }
