[package]
name = "pw-link"
description = "Pitwall link: transport, framing, handshake with device-key proof, channel multiplexing and the RemoteHost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Desktop 쪽 SSH 부트스트랩(18-m7-plan M7-06): 시스템 `ssh` 실행(`ssh`) · Relay 설치 · SSH 자동 페어링(`install`). Relay 바이너리는
# 켜지 않는다 — 받기(reqwest) · 매니페스트 검증(pw-release)이 원격 바이너리에 들지 않게(크기 — 메인 판정 M7-P13).
bootstrap = ["dep:pw-release", "dep:reqwest", "dep:semver", "tokio/process"]
# 시험용 가짜 `ssh`(`fake_ssh` — apps/relay 의 설치 시험이 쓴다).
test-support = ["bootstrap"]

[dependencies]
# 기기 키 · 서명 · 도전값을 글로 싣는다(틀 본문은 JSON — 18-m7-plan M7-03 ②).
base64 = "0.22.1"
# 기기 키와 도전 서명(18-m7-plan 결정 M7-D13 · 메인 판정 M7-P6). Noise(M7-23)도 같은 키를 쓴다.
ed25519-dalek = "3.0.0"
# 키 · 도전값의 난수. ed25519-dalek 의 rand_core 기능 대신 씨앗 32바이트를 OS 에서 받는다.
getrandom = "0.4.3"
# Desktop 기기 키를 OS 키체인에 둔다(pw-db 의 `KeyringStore` 와 같은 판).
keyring = "4.2.0"
pw-core = { path = "../pw-core" }
pw-rpc = { path = "../pw-rpc" }
# Relay 매니페스트 서명 검증 · 출처(개발 빌드 갈래는 debug 만 — `pw_release::relay::source`). M7-05 가 쓰는 쪽과 한 파일이다.
pw-release = { path = "../pw-release", optional = true }
# 릴리스 자산 받기(`$CACHE/relay-dist/`). 데스크톱의 업데이트 확인과 같은 판 · TLS 구성(rustls, 암호 제공자 ring)이라 크레이트가
# 늘지 않는다. 첫 요청 전에 ring 제공자를 기본으로 건다.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "system-proxy",
], optional = true }
# TLS 제공자 ring — 받기(reqwest)와 직접 연결(QUIC — M7-24)이 함께 쓴다. QUIC 의 TLS 는 신뢰 근거가 아니다(인증서는 무엇이든 받고 Noise
# 가 상대를 판정한다 — `quic` 머리 주석).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# 직접 연결 전송(18-m7-plan M7-24 ① · 메인 판정 M7-P14). 런타임 tokio · TLS rustls(ring)만 — 플랫폼 검증기 · aws-lc · 로그 갈래는 끈다.
quinn = { version = "0.11.12", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
# QUIC 받는 쪽의 자체 서명 인증서(뜰 때마다 새로 만든다 — 이름은 고정값, 머신 이름을 싣지 않는다). ring 갈래만.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
# 원격 Relay 바이너리의 판 차례(최근 두 판만 남기기 — 18-m7-plan M7-07 ③). 워크스페이스가 이미 쓰는 판이다.
semver = { version = "1.0.28", optional = true }
# 코드 페어링의 키 확인 MAC(18-m7-plan M7-23 ②). sha2 0.11 과 같은 digest 판.
hmac = "0.13.0"
# 6자리 코드 페어링의 PAKE(18-m7-plan M7-23 ② — 메인 판정: 코드를 psk · HMAC 로 쓰면 처음 붙는 능동 중간자가 오프라인 대입한다).
# 0.4 는 snow 와 같은 curve25519-dalek 4 를 쓴다(ed25519-dalek 3 의 dalek 5 와 메이저가 하나 더 — 둘이 나눠 쓴다).
spake2 = "0.4.0"
# 직접 연결의 세션 암호(Noise XX — 18-m7-plan M7-23 ① · 08 「보안 모델」). 정적 키는 기기 Ed25519 키를 X25519 로 바꾼 것.
# 쓰는 암호만 켠다(AES-GCM · SHA-2 · ring 갈래는 끈다).
snow = { version = "0.10.0", default-features = false, features = [
  "use-curve25519",
  "use-chacha20poly1305",
  "use-blake2",
  "use-getrandom",
] }
# 링크 틀은 LSP · DAP 와 같은 `Content-Length` 틀이다(메인 판정 M7-P2).
pw-wire = { path = "../pw-wire" }
# 기기 관리 RPC(`relay.*` — M7-23 ③)의 입출력 타입.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# raw_value: 받아 둔 채널 메시지는 원시 바이트로 두고 꺼낼 때 푼다(받기 예산이 실제 메모리 상한이 되게).
serde_json = { workspace = true, features = ["raw_value"] }
# 머신 id = Relay 기기 공개키의 SHA-256 지문(메인 판정 M7-P6). ed25519-dalek 이 쓰는 판과 같다.
sha2 = "0.11.1"
specta = { workspace = true, features = ["derive"] }
# net: 포트 포워딩(18-m7-plan M7-22) — Desktop 은 루프백에서 듣고 Relay 는 그 머신에서 TCP 를 연다.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util", "fs", "net"] }
tokio-util = { workspace = true }
tracing = "0.1.44"
zeroize = "1.9.1"

# Windows: 포워딩의 듣는 소켓에 `SO_EXCLUSIVEADDRUSE`(`forward::bind` — 다른 프로세스가 그 포트를 가로채지 못하게). 워크스페이스가
# 이미 쓰는 판이다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
# 설치 시험의 개발 빌드 매니페스트(`pw_release::relay::assemble`).
semver = "1.0.28"
tempfile = "3.27.0"
# 코드가 로그에 실리지 않는지 본다(M7-23).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "io-util",
  "test-util",
] }
