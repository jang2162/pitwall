# pre-commit 은 staged 파일만 고치고, pre-push 는 저장소 전체를 검사한다(고치지 않는다).
# 도구는 전부 설치본(pnpm exec / cargo)으로 부른다. pnpx 를 쓰지 않는다.
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,mjs,cjs,jsx,ts,tsx,json,md,yml,yaml,css,html}"
      run: "pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}"
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,mjs,cjs,jsx,ts,tsx}"
      run: "pnpm exec oxlint --deny-warnings {staged_files}"
    - name: rustfmt
      glob: "*.rs"
      run: "rustfmt --edition 2024 {staged_files}"
      stage_fixed: true

pre-push:
  jobs:
    - name: fmt-check
      run: "cargo fmt --all --check && pnpm exec oxfmt --check ."
    - name: clippy
      run: "cargo clippy --workspace --all-targets --all-features -- -D warnings"
    - name: oxlint
      run: "pnpm exec oxlint --deny-warnings"
    - name: tsc
      run: "pnpm -r --if-present run typecheck"
    - name: actionlint
      run: "actionlint"
    # RPC 선언을 바꾸고 `mise run gen` 을 잊으면 CI 의 lint 가 실패한다. 그 전에 여기서 잡는다.
    - name: rpc-gen
      run: "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen -- --check && cargo run -q -p pw-rpc-gen --bin pw-rpc-gen-fixtures -- --check"
    # 의존성을 바꾸고 `mise run notices` 를 잊으면 CI 의 licenses 잡이 실패한다. 그 전에 여기서 잡는다.
    - name: notices
      run: "node scripts/licenses.mjs notices --check"

# 순차 실행이다 — 런타임이 맞은 뒤에 설치가 돌아야 한다.
# 세 번째 인자({3})가 0 이면 파일 단위 체크아웃(git checkout -- <파일>)이라 브랜치가 바뀌지 않았으므로 건너뛴다.
post-checkout:
  jobs:
    - name: runtime
      run: "[ '{3}' = 0 ] && exit 0; if command -v mise >/dev/null; then mise trust && mise install; else echo 'mise 가 없어 런타임 버전을 맞추지 못했다'; fi"
    - name: deps
      run: "[ '{3}' = 0 ] && exit 0; pnpm install"
