# 도구 버전은 전부 mise.toml 이 정본이다. 로컬과 같은 `mise run <태스크>` 를 부르므로 단계를 여기서 다시 쓰지 않는다.
# 액션은 커밋 SHA 로 고정한다(태그는 옮겨질 수 있다). 올릴 때 주석의 버전도 함께 고친다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 새 취약점 공지는 코드가 안 바뀌어도 올라온다. PR 이 없는 날에도 잡히게 매일 advisories 만 돌린다.
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # mise 자체의 버전. 도구 버전이 아니라 mise.toml 을 읽는 쪽의 버전이다.
  MISE_VERSION: 2026.4.3
  # 도구를 받는 요청이 끊기면(러너 → GitHub 릴리스, 실제로 Windows 에서 broken pipe 로 두 번 연달아) 다시 보낸다. 이 판의 기본값은
  # 0(한 번만)이다. 기다림은 지수(10 ms 의 10배씩)에 무작위를 곱한 값이라 4번이면 많아야 11초쯤이다. 이 판은 요청을 보내는 단계의
  # 실패만 다시 하고, 받는 도중 끊긴 본문은 다시 하지 않는다.
  MISE_HTTP_RETRIES: 4

jobs:
  check:
    name: lint · test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # cargo-about 소스 빌드가 들어가는 첫 실행(캐시 없음)을 감안한 값이다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}

      # lint 가 부르는 rustfmt · clippy 를 rust-toolchain.toml 그대로 깐다. mise 의 rust 는 ~/.cargo/bin 을 가리키는 심링크라
      # mise 캐시가 맞으면 설치를 건너뛰고, 툴체인(~/.rustup)은 그 캐시에 없다. 그러면 첫 cargo 호출이 툴체인을 자동 설치하는데
      # mise 가 준 RUSTUP_TOOLCHAIN 이 툴체인 파일을 가려 러너의 minimal 프로필(rustfmt · clippy 없음)로만 깔린다.
      # RUSTUP_TOOLCHAIN 을 뺀 채 인자 없이 부르면 툴체인 파일대로 깔고, 이미 있으면 빠진 components 만 더한다.
      - name: Rust toolchain components
        shell: bash
        run: env -u RUSTUP_TOOLCHAIN rustup toolchain install --no-self-update

      - name: pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 데스크톱 크레이트(Tauri 2)를 clippy·nextest 가 컴파일하는 데 필요한 시스템 라이브러리.
      # 목록은 Tauri 2 공식 문서 「Prerequisites → Linux(Debian/Ubuntu)」 그대로다. macOS 는 Xcode 명령행 도구,
      # Windows 는 MSVC 빌드 도구와 WebView2 런타임이 GitHub 러너 이미지에 이미 들어 있어 단계가 없다.
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile
      - run: mise run lint
      # nextest 의 ci 프로필(.config/nextest.toml)은 첫 실패에서 멈추지 않는다 — 실패한 시험을 한 번에 다 본다.
      - run: mise run test
        env:
          NEXTEST_PROFILE: ci
      # 「release 에서만 판정」하는 시간 상한 시험(검색 취소 100 ms · fs.list 1만 개 · 구문 강조 16 ms · git 감시 이벤트 500 ms). 위 test 는 debug 라 이것들을
      # 판정하지 않는다. 벽시계를 재므로 러너가 일정한 Linux · macOS 만 돌린다(Windows 는 파일 시스템 지연이 들쭉날쭉하다).
      # 시험을 하나도 못 고르면 --no-tests=fail 로 실패한다.
      - name: release timing tests
        if: runner.os != 'Windows'
        run: mise run test-release
        env:
          NEXTEST_PROFILE: ci
      # npm 라이선스 검사는 그 OS 에 설치된 패키지만 본다. OS 전용 바이너리 패키지(esbuild·rollup·oxc 등)를
      # 각 OS 에서 보도록 매트릭스마다 돌린다. 네트워크가 필요 없다.
      - run: node scripts/licenses.mjs check

  # 성능 기준선(docs/design/06-roadmap.md 「성능 목표 (검증 기준)」). macOS release 번들의 콜드 스타트 · 유휴 메모리를 재
  # job summary 와 artifact 로 남긴다. 무엇을 재는지는 CONTRIBUTING.md 「성능 기준선」 절.
  # 러너는 느리고 들쭉날쭉하므로 기록만 한다 — 목표를 넘어도(pw-perf 는 넘어도 0 으로 끝난다), 측정이 실패해도 PR 을 막지
  # 않는다(continue-on-error). 러너에 창이 그려지지 않으면 첫 프레임 표시가 오지 않아 시간 제한으로 실패한다.
  # 유효한 회가 --runs 의 절반보다 적으면(가려짐 · 잠금으로 빠진 회가 많으면) pw-perf 는 3 으로 끝나 step 이 실패로 보인다.
  perf:
    name: perf baseline (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      # mise run 은 기본으로 mise.toml 의 빠진 도구를 전부 설치한다. 아래 install_args 로 고른 것만 쓰게 끈다.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          # 번들 빌드(Tauri CLI 는 node_modules)와 측정에 필요한 것만 받는다.
          install_args: node npm:pnpm rust

      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: pnpm install --frozen-lockfile
      - run: mise run perf -- --out target/perf/ci

      - name: Job summary
        if: always()
        run: |
          if [ -f target/perf/ci/summary.md ]; then
            cat target/perf/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No performance summary: the measurement did not finish (see the perf step's log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # result.json · summary.md 와 회마다의 표시 파일 · 앱 로그(run-*/marks.jsonl, run-*/logs).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-baseline
          path: target/perf/ci
          if-no-files-found: warn

  licenses:
    name: licenses · notices
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}

      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      # cargo-deny licenses·bans·sources + npm 라이선스 + THIRD_PARTY_NOTICES.md 최신 여부. PR 을 막는다.
      - run: mise run licenses

  linguist-samples:
    name: linguist samples
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # mise run 은 기본으로 mise.toml 의 빠진 도구를 전부 설치한다. 아래 install_args 로 고른 것만 쓰게 끈다.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          # 스크립트(node) · 빌드(rust) · 시험(nextest)만 쓴다. pnpm 의존성은 설치하지 않는다.
          install_args: node rust aqua:nextest-rs/nextest/cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Linguist samples(고정 커밋)를 GitHub 에서 받아 pw-lang 의 일치율이 하한 이상인지 본다. PR 을 막는다.
      - run: mise run lang-samples

  # 실 DB 시험(14-m3-plan.md M3-01 · 결정 M3-D16). 서비스 컨테이너는 Linux 러너에서만 돌고 행렬 잡에는 `services:` 를 걸 수
  # 없어 ubuntu 잡을 따로 둔다. DB 마다(와 SSH 터널 — M3-11) 단계 하나 — scripts/db-live.mjs 가 그 DB 의 live 시험만 release 로 돌리고, 필터가 0개를
  # 고르거나 준비 확인 시험(live_<db>_ready)을 뺀 수가 하한(scripts/db-live.toml) 아래면 실패한다. 이 잡에서 어느 DB 든 「0개면
  # 실패」 를 지우는 변경은 리뷰에서 거절한다(14 「공유 부품의 주인」). 병합을 막으려면 저장소 설정에서 필수 검사로 둔다.
  # 서비스 이미지는 판과 digest 로 고정한다(배포물이 아니라 라이선스는 따지지 않는다). Redis 는 7.2 줄이다 — 서버 라이선스가
  # 7.4 부터 RSALv2/SSPLv1(8.0 부터 AGPLv3 선택)로 바뀌었고 7.2.x 는 BSD-3-Clause 다. 판을 올리면 이 주석도 고친다.
  # 서비스 준비는 각 단계의 준비 확인 시험이 120 s 까지 기다린다(health-cmd 를 두지 않는다).
  db-live:
    name: db-live
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # mise run 은 기본으로 mise.toml 의 빠진 도구를 전부 설치한다. 아래 install_args 로 고른 것만 쓰게 끈다.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      NEXTEST_PROFILE: ci
      PW_TEST_PG_URL: postgres://pitwall:pitwall@127.0.0.1:5432/pitwall
      PW_TEST_MYSQL_URL: mysql://root:pitwall@127.0.0.1:3306/pitwall
      PW_TEST_MARIADB_URL: mysql://root:pitwall@127.0.0.1:3307/pitwall
      PW_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: pitwall
          POSTGRES_DB: pitwall
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: pitwall
          MYSQL_DATABASE: pitwall
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
        env:
          MARIADB_ROOT_PASSWORD: pitwall
          MARIADB_DATABASE: pitwall
        ports:
          - 3307:3306
      redis:
        image: redis:7.2.10@sha256:8cd70b529aec2af55a072917098c1ae6f1d9eb975ac1cf36928c7d5af7574f08
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          # 스크립트(node) · 빌드(rust) · 시험(nextest)만 쓴다. pnpm 의존성은 설치하지 않는다.
          install_args: node rust aqua:nextest-rs/nextest/cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # TLS 시험 서버(14-m3-plan.md M3-06): 서비스 컨테이너는 checkout 전에 떠 저장소의 파일을 마운트할 수 없어 여기서 띄운다. 시험
      # CA · 서버 인증서를 그 자리에서 만들고 시험 CA 로 서명한 두 번째 PG 와 TLS 만 받는 Redis 를 띄운 뒤 PW_TEST_PG_TLS_URL ·
      # PW_TEST_REDIS_TLS_URL · PW_TEST_TLS_CA 를 GITHUB_ENV 로 넘긴다(scripts/db-tls.mjs). 서버가 다 뜨기는 TLS 시험이 준비 확인으로 기다린다.
      - name: tls test servers
        run: node scripts/db-tls.mjs --out "$RUNNER_TEMP/pitwall-tls"

      # SSH 터널 시험의 sshd(14-m3-plan.md M3-11): 키를 그 자리에서 만들고 alpine 에 openssh-server 를 설치해 띄운 뒤
      # PW_TEST_SSH_URL · PW_TEST_SSH_DIR 을 GITHUB_ENV 로 넘긴다(scripts/db-ssh.mjs). 설치가 끝나기는 준비 확인 시험이 기다린다.
      - name: ssh test server
        run: node scripts/db-ssh.mjs --out "$RUNNER_TEMP/pitwall-ssh"

      # `--ci`: URL 이 없으면 건너뛰지 않고 실패한다. 단계마다 고른 · 돈 · 센 시험 수를 출력한다. 한 DB 가 실패해도 나머지
      # DB 의 단계는 돈다(`!cancelled()`) — 판정은 DB 마다 따로다.
      - name: live pg
        if: ${{ !cancelled() }}
        run: mise run test-db -- --ci pg
      - name: live mysql
        if: ${{ !cancelled() }}
        run: mise run test-db -- --ci mysql
      - name: live mariadb
        if: ${{ !cancelled() }}
        run: mise run test-db -- --ci mariadb
      - name: live redis
        if: ${{ !cancelled() }}
        run: mise run test-db -- --ci redis
      - name: live ssh_tunnel
        if: ${{ !cancelled() }}
        run: mise run test-db -- --ci ssh_tunnel

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR 에서는 경고만 한다 — 새 공지는 그 PR 의 변경과 무관하게 올라와 모든 PR 을 깨뜨린다.
    # main push 와 매일 schedule 에서는 실패시킨다.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      # mise run 은 기본으로 mise.toml 의 빠진 도구를 전부 설치한다. 아래 install_args 로 고른 것만 쓰게 끈다.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ env.MISE_VERSION }}
          # cargo-deny 와 그것이 부르는 cargo 만 있으면 된다. 소스 빌드하는 cargo-about 등은 받지 않는다.
          # node 는 mise 가 npm:pnpm 버전을 풀 때 npm 을 부르므로 함께 둔다(없으면 경고가 난다).
          install_args: node rust aqua:EmbarkStudios/cargo-deny

      # RustSec 데이터베이스를 네트워크로 받는다.
      - run: mise run advisories
