[workspace]
resolver = "3"
# apps/ 의 크레이트는 글롭 없이 경로로 하나씩 적는다. 앱마다 크레이트 자리가 다를 수 있고(Tauri 앱은 src-tauri/),
# 맞는 경로가 하나도 없는 글롭은 cargo 가 매니페스트 로드 실패로 처리한다.
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.0"
publish = false

# 기능(feature)은 쓰는 크레이트가 고른다. 여기서는 버전만 고정한다.
[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
tokio = "1.53.3"
tokio-util = "0.7.20"
inventory = "0.3.25"
schemars = "1.2.3"
# specta 2 는 아직 RC 이고, RC 사이에도 API 가 바뀐다(2.0.0-rc.25 · specta-typescript 0.0.12 에서 맞춘 코드다).
# `=` 로 고정해 lockfile 갱신이 생성물 형태를 말없이 바꾸지 않게 한다. 셋은 함께 올린다.
specta = "=2.0.0-rc.25"
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
