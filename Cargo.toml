[workspace]
resolver = "3"
# apps/ 의 크레이트는 글롭 없이 경로로 하나씩 적는다. 앱마다 크레이트 자리가 다를 수 있고(Tauri 앱은 src-tauri/),
# 맞는 경로가 하나도 없는 글롭은 cargo 가 매니페스트 로드 실패로 처리한다.
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.0"
publish = false

# 기능(feature)은 쓰는 크레이트가 고른다. 여기서는 버전만 고정한다.
[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
tokio = "1.53.3"
tokio-util = "0.7.20"
inventory = "0.3.25"
schemars = "1.2.3"
# specta 2 는 아직 RC 이고, RC 사이에도 API 가 바뀐다(2.0.0-rc.25 · specta-typescript 0.0.12 에서 맞춘 코드다).
# `=` 로 고정해 lockfile 갱신이 생성물 형태를 말없이 바꾸지 않게 한다. 셋은 함께 올린다.
specta = "=2.0.0-rc.25"
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"

# 구문 분석(pw-syntax)의 `wasm` 기능은 문법 WASM 을 wasmtime 의 cranelift 로 기계어로 컴파일해 올린다(시험만 켠다). dev 빌드에서 이
# 크레이트들을 최적화하지 않으면 큰 문법 하나를 올리는 데 1초쯤 걸려 함께 도는 시간 민감 시험을 흔든다.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
