[workspace]
resolver = "3"
# apps/ 의 크레이트는 글롭 없이 경로로 하나씩 적는다. 앱마다 크레이트 자리가 다를 수 있고(Tauri 앱은 src-tauri/),
# 맞는 경로가 하나도 없는 글롭은 cargo 가 매니페스트 로드 실패로 처리한다.
members = ["crates/*", "apps/desktop/src-tauri", "apps/relay"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.0"
publish = false

# 기능(feature)은 쓰는 크레이트가 고른다. 여기서는 버전만 고정한다.
[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.154"
tokio = "1.53.3"
tokio-util = "0.7.20"
inventory = "0.3.25"
schemars = "1.2.3"
# specta 2 는 아직 RC 이고, RC 사이에도 API 가 바뀐다(2.0.0-rc.25 · specta-typescript 0.0.12 에서 맞춘 코드다).
# `=` 로 고정해 lockfile 갱신이 생성물 형태를 말없이 바꾸지 않게 한다. 셋은 함께 올린다.
specta = "=2.0.0-rc.25"
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
# SQL 위험도 분류(pw-db-sql 의 risk, 14-m3-plan.md 결정 M3-D5). 기능은 쓰는 크레이트가 켠다(`visitor`).
sqlparser = "0.63.0"
# PostgreSQL 드라이버(pw-db-driver-pg, 14-m3-plan.md 결정 M3-D1 · M3-D10). TLS 공급자는 `ring` 하나 — 각 크레이트에서 기능을 고른다.
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.2"
tokio-postgres-rustls = { version = "0.14.0", default-features = false }
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = "0.7.1"
rustls-webpki = { version = "0.103.16", default-features = false }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }

# Redis 드라이버(pw-db-driver-redis, 14-m3-plan.md M3-09). 크레이트의 TLS 기능은 켜지 않는다 — TLS 스트림은 Pitwall 이
# tokio-rustls(ring) + rustls-platform-verifier 로 만들어 넘긴다(결정 M3-D10). 기본 기능(acl · streams · script 등)도 끈다.
# rustls · rustls-platform-verifier 는 위 PostgreSQL 줄을 함께 쓴다.
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# 구문 분석(pw-syntax)의 `wasm` 기능은 문법 WASM 을 wasmtime 의 cranelift 로 기계어로 컴파일해 올린다(시험만 켠다). dev 빌드에서 이
# 크레이트들을 최적화하지 않으면 큰 문법 하나를 올리는 데 1초쯤 걸려 함께 도는 시간 민감 시험을 흔든다.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

# Relay 배포물(18-m7-plan M7-05 ④ — 원격 디스크 「바이너리 한 판 < 56 MiB」, 메인 판정 M7-P13). 기능을 빼지 않고 크기만 줄인다:
# 한 덩어리 LTO · 코드 생성 단위 1 · 크기 최적화 · 기호 제거. macOS arm64 에서 잰 값(stripped): release 기본 81.6 MiB → fat LTO 63.8
# → opt-level "s" 50.4 → "z" 41.2 MiB(x86_64 49.1). "z" 의 유휴 RSS · 기동은 release 기본보다 낮았다(28.6 → 22.9 MiB). panic 은 unwind 그대로다
# — RPC 세션이 핸들러 패닉을 `catch_unwind` 로 가둬 데몬이 살아남는다(`abort` 면 핸들러 하나의 패닉이 데몬을 끝낸다).
# 데스크톱 앱 · 시험은 이 프로필을 쓰지 않는다. 쓰는 곳: scripts/relay-build.mjs(`mise run relay-build` · CI · 릴리스).
# Linux musl 은 같은 코드가 더 크다(2026-11-24 잰 값) — x86_64 의 첫 CI 빌드가 60,571,968 B(57.8 MiB)로 상한을 넘었다. 몫:
# `.eh_frame` + `.eh_frame_hdr` 약 8.3 MB(ELF 의 풀기 표 — Mach-O 는 압축 표라 작다, unwind 라 뺄 수 없다)와 x86_64 static-pie 의
# `.rela.dyn` 4.1 MB(상대 재배치 약 17만 개 × 24 B). 뒤의 것을 relay-build.mjs 가 링크에서 RELR 로 싸 38 KB 로 줄인다(thin LTO 로 잰
# x86_64: 69,628,336 → 65,544,704 B, static-pie 그대로). aarch64 musl 은 static-pie 가 아니라 `.rela.dyn` 이 없다.
[profile.relay]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
