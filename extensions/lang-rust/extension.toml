# Rust 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-rust"
name = "Rust"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.rust]
linguist = "Rust"
builtin_grammar = "rust"
queries = "queries/rust"
line_comment = "//"

# 언어 서버(docs/design/15-m4-plan.md 결정 M4-D1 · D2 · D7). 앱에 동봉하지 않는다 — 설정 경로 → 런타임 환경 PATH(rustup 프록시는
# 컴포넌트가 있을 때만) → Pitwall 설치본($DATA/tools) 순으로 찾고, 없으면 설치를 제안한다. 판 · 설정 값은 M4-18 이 고친다.
[contributes.language_servers.rust-analyzer]
languages = ["rust"]
mason = "rust-analyzer"
command = "rust-analyzer"
root_markers = ["Cargo.toml", "rust-project.json"]
resolve_hint = "rustup"
# 작업 공간을 읽는 동안 받은 편집을 분석에 넣지 않은 채 포맷에 답한다(옛 글 기준 편집) — 그 진행 중의 포맷 답은 버린다(M4-13).
format_unreliable_while_progress = ["Roots Scanned"]

# 디버거(17-m6-plan.md M6-19 · 결정 M6-D2). codelldb 는 `--port` 없이 띄우면 표준 입출력으로 말한다(v1.12.3 `src/codelldb/src/lib.rs`
# — 포트를 열지 않는다). 해석은 언어 서버와 같다: `[dap.codelldb] path` → 프로젝트 로컬 → PATH → Pitwall 설치본($DATA/tools).
# 틀의 값은 실행 구성 `[debug]` 에서 온다 — `{cwd}` · `{env}` 는 Pitwall 이 실행과 같은 판정으로 채운다(M6-17). 대상은 `runInTerminal`
# 로 실행 관리자의 PTY 에서 돈다(codelldb 의 기본 `terminal = "integrated"`).
[contributes.debug_adapters.codelldb]
languages = ["rust"]
mason = "codelldb"
command = "codelldb"
launch = { program = "{program}", args = "{args}", cwd = "{cwd}", env = "{env}", stopOnEntry = "{stop_on_entry}", sourceLanguages = [
  "rust",
] }
attach = { pid = "{pid}", program = "{program}", waitFor = "{wait_for}", sourceLanguages = [
  "rust",
] }
