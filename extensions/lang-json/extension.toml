# JSON 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). grammars/ · queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-json"
name = "JSON"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.json]
linguist = "JSON"
grammar = "grammars/json.wasm"
queries = "queries/json"

# tsconfig.json · .jsonc 등(Linguist 「JSON with Comments」). 같은 문법이 주석도 읽는다.
[contributes.languages.jsonc]
linguist = "JSON with Comments"
grammar = "grammars/json.wasm"
queries = "queries/json"
line_comment = "//"
