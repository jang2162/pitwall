# Java 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-java"
name = "Java"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.java]
linguist = "Java"
builtin_grammar = "java"
queries = "queries/java"
line_comment = "//"

# 언어 서버(docs/design/15-m4-plan.md 결정 M4-D1 · D4 · D6). 서버는 JDK 25 이상으로 돈다(jdtls 1.62.0 부터 번들이 JavaSE-25 를
# 요구한다 — JDK 21 로는 기동 직후 끝난다, M4-18 실측) — 프로젝트의 JDK(17 등)와 따로다: 서버 관리자가 requires 로 찾은 JDK 를
# 서버 환경의 PATH 맨 앞 · JAVA_HOME 에 넣는다. 설치본은 덮어쓰기 정의(crates/pw-tools/overrides/jdtls.toml)가 설치 폴더에 런처
# pitwall/jdtls("$JAVA_HOME/bin/java" -jar …)를 두므로 command 는 "jdtls" 그대로다.
[contributes.language_servers.jdtls]
languages = ["java"]
mason = "jdtls"
command = "jdtls"
root_markers = [
  "settings.gradle",
  "settings.gradle.kts",
  "build.gradle",
  "build.gradle.kts",
  "pom.xml",
]
requires = { java = ">=25" }
# 프로젝트가 쓰는 JDK(서버를 돌리는 JDK 와 따로다 — 결정 M4-D6)를 서버 관리자가 이 설정 경로로 넘긴다(15-m4-plan.md M4-18).
project_jdk_setting = "java.configuration.runtimes"
# `initialize` 를 60 s 기다린다(기본 10 s) — JVM 이 뜨는 동안 서버가 아무것도 보내지 않아 첫 답이 느리다. CI 러너(4 vCPU, JVM 서버
# 둘 동시)의 jdtls 시험은 5 – 14 s 였다(15-m4-plan.md 「jdtls 첫 기동의 `initialize`」 행).
initialize_timeout = 60

# jdtls 는 시그니처 도움말이 기본으로 꺼져 있다(`java.signatureHelp.enabled` 기본 false — 꺼져 있으면 늘 `signatures: []`, M4-18
# 실측). jdtls 는 `workspace/configuration` 을 묻지 않고 `initializationOptions.settings` 와 `workspace/didChangeConfiguration` 으로만
# 설정을 받는다 — 서버 관리자가 `initialized` 바로 뒤에 합친 설정(이 값 위에 사람의 `[lsp.jdtls] settings`)을 `didChangeConfiguration`
# 으로 민다(M4-18). 사람이 `[lsp.jdtls.settings.java.signatureHelp] enabled = false` 로 끌 수 있다.
[contributes.language_servers.jdtls.settings.java.signatureHelp]
enabled = true

# 디버거(17-m6-plan.md M6-19 · 결정 M6-D2 · M6-P20 — JVM 은 attach 만). java-debug 는 실행 파일이 없는 jdtls 플러그인이다: 설치돼
# 있으면 그 jar 가 jdtls 의 `initializationOptions.bundles` 에 실리고, 디버그를 시작하면 떠 있는 jdtls 에 `vscode.java.startDebugSession`
# 을 보내 받은 포트(127.0.0.1)로 붙는다 — jdtls 가 떠 있지 않으면 거절. 설치되는 jar 는 상류의 것이 아니라 그 서버 소켓을
# 127.0.0.1 에만 묶도록 고친 것이다(06-roadmap.md 결정 D71 — crates/pw-tools/patches/java-debug/). attach 대상은 사람이 JDWP 를 켜고
# 띄운 JVM(`-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005`)이고 `[debug] port` 로 고른다. Kotlin 은
# 같은 JDWP attach 로 확인만 하고 보장하지 않는다(결정 D65 — 소스 찾기가 jdtls 작업 공간을 쓰고 jdtls 는 `.kt` 를 모른다).
[contributes.debug_adapters.java-debug]
languages = ["java", "kotlin"]
mason = "java-debug-adapter"
start = { lsp = "jdtls", command = "vscode.java.startDebugSession", bundles = [
  "java-debug-adapter/com.microsoft.java.debug.plugin.jar",
] }
attach = { hostName = "127.0.0.1", port = "{port}", projectName = "{project_name}", timeout = "{timeout}" }
