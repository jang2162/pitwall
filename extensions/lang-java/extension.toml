# Java 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-java"
name = "Java"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.java]
linguist = "Java"
builtin_grammar = "java"
queries = "queries/java"
line_comment = "//"

# 언어 서버(docs/design/15-m4-plan.md 결정 M4-D1 · D4 · D6). 서버는 JDK 21 이상으로 돈다 — 프로젝트의 JDK(17 등)와 따로다:
# 서버 관리자가 requires 로 찾은 JDK 를 서버 환경의 PATH 맨 앞 · JAVA_HOME 에 넣는다. 설치본은 덮어쓰기 정의(M4-03 틀 · M4-18
# 내용)가 설치 폴더에 bin/jdtls 런처("$JAVA_HOME/bin/java" -jar …)를 두므로 command 는 "jdtls" 그대로다.
[contributes.language_servers.jdtls]
languages = ["java"]
mason = "jdtls"
command = "jdtls"
root_markers = [
  "settings.gradle",
  "settings.gradle.kts",
  "build.gradle",
  "build.gradle.kts",
  "pom.xml",
]
requires = { java = ">=21" }
