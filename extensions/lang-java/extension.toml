# Java 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-java"
name = "Java"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.java]
linguist = "Java"
builtin_grammar = "java"
queries = "queries/java"
line_comment = "//"

# 언어 서버(docs/design/15-m4-plan.md 결정 M4-D1 · D4 · D6). 서버는 JDK 25 이상으로 돈다(jdtls 1.62.0 부터 번들이 JavaSE-25 를
# 요구한다 — JDK 21 로는 기동 직후 끝난다, M4-18 실측) — 프로젝트의 JDK(17 등)와 따로다: 서버 관리자가 requires 로 찾은 JDK 를
# 서버 환경의 PATH 맨 앞 · JAVA_HOME 에 넣는다. 설치본은 덮어쓰기 정의(crates/pw-tools/overrides/jdtls.toml)가 설치 폴더에 런처
# pitwall/jdtls("$JAVA_HOME/bin/java" -jar …)를 두므로 command 는 "jdtls" 그대로다.
[contributes.language_servers.jdtls]
languages = ["java"]
mason = "jdtls"
command = "jdtls"
root_markers = [
  "settings.gradle",
  "settings.gradle.kts",
  "build.gradle",
  "build.gradle.kts",
  "pom.xml",
]
requires = { java = ">=25" }
# 프로젝트가 쓰는 JDK(서버를 돌리는 JDK 와 따로다 — 결정 M4-D6)를 서버 관리자가 이 설정 경로로 넘긴다(15-m4-plan.md M4-18).
project_jdk_setting = "java.configuration.runtimes"
