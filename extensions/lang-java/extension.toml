# Java 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). grammars/ · queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-java"
name = "Java"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.java]
linguist = "Java"
grammar = "grammars/java.wasm"
queries = "queries/java"
line_comment = "//"
