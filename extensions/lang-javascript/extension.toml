# JavaScript 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-javascript"
name = "JavaScript"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.javascript]
linguist = "JavaScript"
builtin_grammar = "javascript"
queries = "queries/javascript"
line_comment = "//"

# 디버거(17-m6-plan.md M6-19 · 결정 M6-D2 — Node 만, 브라우저는 뺀다). js-debug 의 `dapDebugServer.js` 는 표준 입출력이 없고 첫 인자가
# 수가 아니면 그 경로의 소켓에서 받는다 — `{socket}` 으로 정의한다(TCP 로 정의하지 않는다, M6-15 리뷰 F1). 런처는 띄울 때의 PATH 의
# node 를 부르고, 서버 관리자가 `requires` 로 찾은 node 를 PATH 앞에 둔다(M6-16). 대상은 `runInTerminal` 로 실행 관리자의 PTY 에서
# 돈다(`console = "integratedTerminal"`). attach 정의(`node --inspect` 로 떠 있는 프로세스의 포트 — `[debug] port`)는 있으나 브레이크포인트가
# 묶이지 않는다 — js-debug v1.140.0 의 attach 자식 세션이 떠 있는 스크립트를 묶지 않는다(원시 DAP 로도, M6-19 보고 — 후속 M6-19b).
[contributes.debug_adapters.js-debug]
languages = ["javascript", "typescript", "tsx"]
mason = "js-debug-adapter"
command = "js-debug-adapter"
args = ["{socket}"]
transport = "socket"
requires = { node = ">=20" }
launch = { type = "pwa-node", program = "{program}", args = "{args}", cwd = "{cwd}", env = "{env}", runtimeExecutable = "{runtime_executable}", runtimeArgs = "{runtime_args}", stopOnEntry = "{stop_on_entry}", console = "integratedTerminal" }
attach = { type = "pwa-node", port = "{port}", address = "{address}", processId = "{pid}" }
