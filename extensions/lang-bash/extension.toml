# 셸 스크립트(Linguist 「Shell」 — sh · bash · zsh) 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」).
# grammars/ · queries/ · LICENSE* 는 생성물이다 — 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-bash"
name = "Bash"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.bash]
linguist = "Shell"
grammar = "grammars/bash.wasm"
queries = "queries/bash"
line_comment = "#"
