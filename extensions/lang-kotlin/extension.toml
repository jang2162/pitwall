# Kotlin 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-kotlin"
name = "Kotlin"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.kotlin]
linguist = "Kotlin"
builtin_grammar = "kotlin"
queries = "queries/kotlin"
line_comment = "//"

# 언어 서버(docs/design/15-m4-plan.md 결정 M4-D1 · D5). 배포물이 JBR 25 를 함께 싣는다(M4-03 실측) — requires 가 없다.
[contributes.language_servers.kotlin-lsp]
languages = ["kotlin"]
mason = "kotlin-lsp"
command = "kotlin-lsp"
args = ["--stdio"]
root_markers = [
  "settings.gradle",
  "settings.gradle.kts",
  "build.gradle",
  "build.gradle.kts",
  "pom.xml",
]
# `initialize` 를 60 s 기다린다(기본 10 s) — JVM 이 뜨는 동안 서버가 아무것도 보내지 않아 첫 답이 느리다. CI 러너(4 vCPU, JVM 서버
# 둘 동시)에서 kotlin-lsp 의 `initialize` 시험은 5.6 – 7.8 s 로 10 s 에 가깝다(jdtls 와 같은 까닭 — 15-m4-plan.md 「jdtls 첫 기동의
# `initialize`」 행).
initialize_timeout = 60
