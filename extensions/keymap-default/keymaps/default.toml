# Pitwall 기본 키맵(docs/design/10-ui.md §4.1 · §4.2 — IntelliJ 기본 키맵 기준).
# 형식은 packages/keymap/src/keymap-file.ts 머리 주석. OS별 표기: mac = IntelliJ macOS, win · linux = IntelliJ Windows.
# 지금 실행할 수 있는 액션만 둔다 — 기능이 생길 때 그 액션의 키를 §4.2 표에서 옮겨 온다.
schema = 1

# 검색 · 이동

[[bindings]]
action = "action.find"
mac = "cmd+shift+a"
win = "ctrl+shift+a"
linux = "ctrl+shift+a"

# Search Everywhere 와 그 탭(src/search-everywhere, 결정 M1-D18). 액션 찾기(⌘⇧A)도 같은 팝업의 액션 탭이다. 파일로 이동 · 최근 파일 ·
# 프로젝트 스위처는 프로젝트 창에만 등록된다.
[[bindings]]
action = "search.everywhere"
key = "shift shift"

[[bindings]]
action = "search.gotoFile"
mac = "cmd+shift+o"
win = "ctrl+shift+n"
linux = "ctrl+shift+n"

[[bindings]]
action = "search.recentFiles"
mac = "cmd+e"
win = "ctrl+e"
linux = "ctrl+e"

[[bindings]]
action = "project.switcher"
mac = "cmd+shift+p"
win = "ctrl+shift+p"
linux = "ctrl+shift+p"

# 전체에서 찾기(10-ui §4.2, src/search/find-in-files.tsx). 프로젝트 창에만 등록된다.
[[bindings]]
action = "search.findInFiles"
mac = "cmd+shift+f"
win = "ctrl+shift+f"
linux = "ctrl+shift+f"

# 프로젝트 · 웰컴 창(10-ui §2.1 · §2.3). 웰컴 창에만 등록되는 액션이라 다른 창의 같은 키와 부딪히지 않는다(registry.ts 머리 주석).

[[bindings]]
action = "project.new"
mac = "cmd+n"
win = "ctrl+n"
linux = "ctrl+n"

[[bindings]]
action = "project.openFolder"
mac = "cmd+o"
win = "ctrl+o"
linux = "ctrl+o"

[[bindings]]
action = "project.removeFromList"
mac = "cmd+backspace"
win = "delete"
linux = "delete"

[[bindings]]
action = "project.create"
mac = "cmd+enter"
win = "ctrl+enter"
linux = "ctrl+enter"

# 외부 도구(10-ui 「외부 도구 · 프로젝트」, 04 F8-4). 프로젝트 창과 웰컴 창(고른 프로젝트)에 등록된다.

[[bindings]]
action = "openWith.popup"
mac = "alt+f1"
win = "alt+f1"
linux = "alt+f1"

[[bindings]]
action = "openWith.default"
mac = "cmd+alt+e"
win = "ctrl+alt+e"
linux = "ctrl+alt+e"

# 툴 윈도우 · 창

[[bindings]]
action = "toolWindow.project"
mac = "cmd+1"
win = "alt+1"
linux = "alt+1"

[[bindings]]
action = "toolWindow.commit"
mac = "cmd+0"
win = "alt+0"
linux = "alt+0"

[[bindings]]
action = "toolWindow.git"
mac = "cmd+9"
win = "alt+9"
linux = "alt+9"

[[bindings]]
action = "toolWindow.run"
mac = "cmd+4"
win = "alt+4"
linux = "alt+4"

[[bindings]]
action = "toolWindow.debug"
mac = "cmd+5"
win = "alt+5"
linux = "alt+5"

[[bindings]]
action = "toolWindow.problems"
mac = "cmd+6"
win = "alt+6"
linux = "alt+6"

[[bindings]]
action = "toolWindow.structure"
mac = "cmd+7"
win = "alt+7"
linux = "alt+7"

[[bindings]]
action = "toolWindow.database"
mac = "cmd+8"
win = "alt+8"
linux = "alt+8"

[[bindings]]
action = "toolWindow.terminal"
mac = "alt+f12"
win = "alt+f12"
linux = "alt+f12"

[[bindings]]
action = "toolWindow.hideAll"
mac = "cmd+shift+f12"
win = "ctrl+shift+f12"
linux = "ctrl+shift+f12"

[[bindings]]
action = "toolWindow.last"
key = "f12"

# 「에디터로 포커스」(src/keymap/actions.ts)는 툴 윈도우에 포커스가 있고 입력 칸이 아닐 때만 — 에디터의 찾기 막대 · 팝업 · 파일 트리의
# 빠른 검색 칸이 Esc 로 닫히는 것과 겹치지 않는다. 터미널의 Esc 는 셸로 간다(터미널이 창으로 넘기는 액션이 아니다,
# src/terminal/terminal-keys.ts). 한글 조합 중의 Esc 는 키맵이 보지 않는다(조합 취소만, 10-ui §4.4).
[[bindings]]
action = "editor.focus"
key = "escape"
when = "toolWindowFocus && !inputFocus"

# 툴 윈도우 크기 조절(10-ui 「툴 윈도우 · 창」). 툴 윈도우에 포커스가 있을 때만 — Win/Linux 의 Ctrl+Shift+←→ 는 에디터의 단어 선택이다.
[[bindings]]
action = "toolWindow.stretchLeft"
mac = "ctrl+alt+shift+left"
win = "ctrl+shift+left"
linux = "ctrl+shift+left"
when = "toolWindowFocus"

[[bindings]]
action = "toolWindow.stretchRight"
mac = "ctrl+alt+shift+right"
win = "ctrl+shift+right"
linux = "ctrl+shift+right"
when = "toolWindowFocus"

[[bindings]]
action = "toolWindow.stretchUp"
mac = "ctrl+alt+shift+up"
win = "ctrl+shift+up"
linux = "ctrl+shift+up"
when = "toolWindowFocus"

[[bindings]]
action = "toolWindow.stretchDown"
mac = "ctrl+alt+shift+down"
win = "ctrl+shift+down"
linux = "ctrl+shift+down"
when = "toolWindowFocus"

# 에디터 탭(10-ui §4.2 「툴 윈도우 · 창」 · 「검색 · 이동」, src/editor/editor-actions.ts). ⌘⌥W 는 Win/Linux 기본 키가 없다(표의 「—」).
# macOS 의 ⌘W 는 `window.close` 다 — 에디터 탭이 있으면 탭, 없으면 창을 닫는다(10-ui §5.2). 네이티브 메뉴 「닫기」 가 같은 액션이라
# 키와 메뉴 accelerator 가 한 액션으로 모인다(src-tauri/src/menu.rs). Win/Linux 의 창 닫기는 OS 의 Alt+F4 다.

[[bindings]]
action = "window.close"
mac = "cmd+w"

# ⌘S 는 활성 탭의 문서를 저장한다(자동 저장 없음, 결정 M1-D13). 네이티브 메뉴 「저장」 이 같은 액션이라 키와 메뉴 accelerator 가
# 한 액션으로 모인다(src-tauri/src/menu.rs). 「모두 저장」(editor.saveAll)은 기본 키가 없다.
[[bindings]]
action = "editor.save"
mac = "cmd+s"
win = "ctrl+s"
linux = "ctrl+s"

[[bindings]]
action = "editor.closeTab"
win = "ctrl+f4"
linux = "ctrl+f4"

[[bindings]]
action = "editor.closeOtherTabs"
mac = "cmd+alt+w"

[[bindings]]
action = "editor.splitRight"
mac = "cmd+backslash"
win = "ctrl+backslash"
linux = "ctrl+backslash"

[[bindings]]
action = "editor.switcher"
mac = "ctrl+tab"
win = "ctrl+tab"
linux = "ctrl+tab"

# 에디터 조작(10-ui §4.2 「검색 · 이동」 · 「코드」, src/editor/editor-ops.ts). 편집 키 · 줄로 이동은 글자 영역(`editorFocus`)에서만, 찾기 ·
# 바꾸기는 찾기 막대 안(`editorFind`)에서도 돈다 — 찾기 칸의 ⌘⌫ 는 글자를 지우고, 웰컴 창의 ⌘⌫(목록에서 제거) · 터미널의 같은 키와
# 겹치지 않는다. Win/Linux 의 Ctrl+Y 는 IntelliJ 대로 줄 삭제다(redo 는 Ctrl+Shift+Z).
#
# undo · redo 는 `when` 이 없다 — 조건 있는 키는 네이티브 메뉴에 accelerator 로 가지 않는데(packages/keymap `menuAccelerators`),
# Win/Linux 의 Edit 메뉴 「실행 취소」 · 「실행 복귀」 가 이 액션이라 메뉴에 키가 보여야 한다(src-tauri/src/menu.rs). 대신 액션이 포커스가
# 에디터 밖의 입력 칸(찾기 막대 · 대화상자 · 터미널)에 있으면 꺼져 키를 그 칸에 둔다(src/editor/editor-ops.ts).

[[bindings]]
action = "editor.undo"
mac = "cmd+z"
win = "ctrl+z"
linux = "ctrl+z"

[[bindings]]
action = "editor.redo"
mac = "cmd+shift+z"
win = "ctrl+shift+z"
linux = "ctrl+shift+z"

[[bindings]]
action = "editor.find"
mac = "cmd+f"
win = "ctrl+f"
linux = "ctrl+f"
when = "editorFocus || editorFind"

[[bindings]]
action = "editor.replace"
mac = "cmd+r"
win = "ctrl+r"
linux = "ctrl+r"
when = "editorFocus || editorFind"

[[bindings]]
action = "editor.gotoLine"
mac = "cmd+l"
win = "ctrl+g"
linux = "ctrl+g"
when = "editorFocus"

# hex 뷰어의 오프셋으로 이동(M1-23, src/editor/hex-viewer.tsx). 줄로 이동과 같은 키지만 hex 뷰어의 키맵 컨텍스트는 `hexFocus` 하나라
# (포커스에서 가장 가까운 `data-keymap-context` 만 본다, src/keymap/context.ts) 두 `when` 이 함께 참이 되는 일이 없다.
[[bindings]]
action = "hex.gotoOffset"
mac = "cmd+l"
win = "ctrl+g"
linux = "ctrl+g"
when = "hexFocus"

[[bindings]]
action = "editor.duplicateLine"
mac = "cmd+d"
win = "ctrl+d"
linux = "ctrl+d"
when = "editorFocus"

[[bindings]]
action = "editor.deleteLine"
mac = "cmd+backspace"
win = "ctrl+y"
linux = "ctrl+y"
when = "editorFocus"

[[bindings]]
action = "editor.moveLineUp"
mac = "alt+shift+up"
win = "alt+shift+up"
linux = "alt+shift+up"
when = "editorFocus"

[[bindings]]
action = "editor.moveLineDown"
mac = "alt+shift+down"
win = "alt+shift+down"
linux = "alt+shift+down"
when = "editorFocus"

[[bindings]]
action = "editor.commentLine"
mac = "cmd+slash"
win = "ctrl+slash"
linux = "ctrl+slash"
when = "editorFocus"

[[bindings]]
action = "settings.open"
mac = "cmd+,"
win = "ctrl+alt+s"
linux = "ctrl+alt+s"

# 파일 트리(src/file-tree, 10-ui §5.4 · §4.2 「이름 바꾸기」). 트리에 포커스가 있을 때만(`fileTree`) — 에디터의 ⇧F6(M4 LSP 이름 바꾸기)
# · ⌘⌫(줄 삭제)와 범위가 겹치지 않는다. 삭제는 IntelliJ 처럼 macOS 에서 ⌫ 와 ⌦(fn+⌫) 둘 다다.

[[bindings]]
action = "fileTree.rename"
key = "shift+f6"
when = "fileTree"

[[bindings]]
action = "fileTree.delete"
mac = "backspace"
win = "delete"
linux = "delete"
when = "fileTree"

[[bindings]]
action = "fileTree.delete"
mac = "delete"
when = "fileTree"

# 터미널(src/terminal/terminal-keys.ts, 10-ui §4.4 「터미널」). 터미널이 포커스를 가지면 키는 대부분 셸로 가고, `when` 이 `terminalFocus` 를
# 읽는 바인딩과 창 단위 액션만 앱이 받는다. macOS 의 복사 · 붙여넣기는 네이티브 Edit 메뉴의 ⌘C · ⌘V 가 한다. 터미널의 ⌘W 는 탭을 닫는다
# (IntelliJ 와 같다) — 메뉴 「닫기」(`window.close`)가 같은 키라 메뉴로 또 오는 것은 keymap-provider.tsx 의 중복 가드가 버린다.

[[bindings]]
action = "terminal.newTab"
mac = "cmd+t"
win = "ctrl+shift+t"
linux = "ctrl+shift+t"
when = "terminalFocus"

[[bindings]]
action = "terminal.closeTab"
mac = "cmd+w"
win = "ctrl+shift+w"
linux = "ctrl+shift+w"
when = "terminalFocus"

[[bindings]]
action = "terminal.copy"
win = "ctrl+shift+c"
linux = "ctrl+shift+c"
when = "terminalFocus"

[[bindings]]
action = "terminal.paste"
win = "ctrl+shift+v"
linux = "ctrl+shift+v"
when = "terminalFocus"
