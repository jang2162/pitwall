# DB(10-ui §4.2 「DB」, 14-m3-plan 「공유 부품의 주인」). 프로젝트 창에만 등록된다. 틀과 차례는 M3-20 이 정했다 — 10-ui 의 DB 표 차례
# (실행 · 쿼리 취소 · 쿼리 콘솔 열기 · 그리드 셀 편집 · 행 추가 · 행 삭제 · 변경 제출 · 되돌리기 · 다른 형식으로 복사 · DDL 보기)대로 두고,
# 행마다 자기 바인딩을 그 자리에 더한다. 포커스 범위는 키맵 컨텍스트로 가른다: SQL 콘솔 `dbConsoleFocus`(M3-15), 테이블 데이터
# `dbTableDataFocus`(M3-17), 결과 · 테이블 데이터 그리드 `dbGridFocus`(M3-16), 탐색기 트리 `dbExplorerFocus`(M3-13). 매칭은 물리 키
# 자리라 한글 입력 상태에서도 같다.

# SQL 콘솔(M3-15, src/db/console/console-feature.tsx): 실행(⌘↩ — 선택이 있으면 선택, 없으면 커서의 문장)과 쿼리 취소(⌘F2)는 콘솔에
# 포커스가 있을 때만: ⌘↩ 은 커밋 툴 윈도우의 커밋 · 테이블 데이터의 변경 제출, ⌘F2 는 10-ui §4.2 의 실행 「중지」 와 범위가 갈린다. 새
# 콘솔(⌘⇧L, Win/Linux Ctrl+Shift+F10)은 프로젝트 창 어디서나 — 인자 없이 부르면 이 창에서 마지막으로 연결한 연결의 새 콘솔이다.

[[bindings]]
action = "db.console.run"
mac = "cmd+enter"
win = "ctrl+enter"
linux = "ctrl+enter"
when = "dbConsoleFocus"

[[bindings]]
action = "db.console.cancel"
mac = "cmd+f2"
win = "ctrl+f2"
linux = "ctrl+f2"
when = "dbConsoleFocus"

[[bindings]]
action = "db.console.open"
mac = "cmd+shift+l"
win = "ctrl+shift+f10"
linux = "ctrl+shift+f10"

# 테이블 데이터(M3-17, src/db/table-data/table-data-feature.tsx — 10-ui §4.2 「DB」 의 그리드 행): 행 추가(⌘N, Win/Linux Alt+Insert) ·
# 행 삭제(⌘⌫, Win/Linux Ctrl+Y) · 변경 제출(⌘↩) · 되돌리기(⌘⌥Z). 셀 편집(↩)은 액션이 아니라 그리드의 키다. 테이블 데이터 뿌리와 그 안의
# 그리드에 포커스가 있을 때만(`dbTableDataFocus`) — ⌘↩ 은 콘솔의 실행 · 커밋 창의 커밋, ⌘N 은 웰컴 창의 새 프로젝트, ⌘⌫ · Ctrl+Y 는
# 에디터의 줄 삭제와 범위가 갈린다. 행 추가 · 삭제는 WHERE · ORDER BY 칸과 셀 편집 칸 안에서는 쉰다(`!inputFocus` — ⌘⌫ 은 줄 앞까지
# 지우기다).

[[bindings]]
action = "db.tableData.addRow"
mac = "cmd+n"
win = "alt+insert"
linux = "alt+insert"
when = "dbTableDataFocus && !inputFocus"

[[bindings]]
action = "db.tableData.deleteRow"
mac = "cmd+backspace"
win = "ctrl+y"
linux = "ctrl+y"
when = "dbTableDataFocus && !inputFocus"

[[bindings]]
action = "db.tableData.submit"
mac = "cmd+enter"
win = "ctrl+enter"
linux = "ctrl+enter"
when = "dbTableDataFocus"

[[bindings]]
action = "db.tableData.revert"
mac = "cmd+alt+z"
win = "ctrl+alt+z"
linux = "ctrl+alt+z"
when = "dbTableDataFocus"

# 결과 그리드의 다른 형식으로 복사(M3-16, src/db/grid/db-grid-feature.tsx): 그리드에 포커스가 있을 때만. Win/Linux 의 Ctrl+Shift+C 는
# 터미널의 복사(`terminalFocus`)와 범위가 갈린다. ⌘C(TSV)는 액션이 아니라 그리드의 copy 이벤트다.

[[bindings]]
action = "db.grid.copyAs"
mac = "cmd+shift+c"
win = "ctrl+shift+c"
linux = "ctrl+shift+c"
when = "dbGridFocus"

# DB 탐색기의 DDL 보기(M3-13, src/db/explorer/explorer-feature.tsx): 고른 테이블 · 뷰의 DDL 을 읽기 전용 SQL 문서로. 탐색기 트리에
# 포커스가 있을 때만(`dbExplorerFocus`) — 에디터의 「선언으로 이동」 ⌘B(10-ui §4.2)와 범위가 갈린다.

[[bindings]]
action = "db.explorer.ddl"
mac = "cmd+b"
win = "ctrl+b"
linux = "ctrl+b"
when = "dbExplorerFocus"

# 코드 (LSP · 편집)(10-ui §4.2 「코드 (LSP · 편집)」, 15-m4-plan §2 — 행마다 이 묶음 아래에 더한다). 글자 영역(`editorFocus`)에서만 돈다.
# 내비게이션(M4-08, src/lsp/navigation-host.tsx): ⌘B 는 DB 탐색기의 DDL 보기(`dbExplorerFocus`)와 범위가 갈린다. ⌘+클릭 · ⌘⌥+클릭은
# 키맵이 아니라 에디터 확장이다(src/lsp/navigation.ts). 사용처 팝업의 ⌘↩(검색 결과에 고정)는 팝업 목록이 받는다.
# rename · 코드 액션(M4-12, src/lsp/edit-ui.tsx): `⇧F6` 은 파일 트리 포커스의 이름 바꾸기(`fileTree.rename`, `when = "fileTree"`)와
# 컨텍스트로 갈린다. 「마지막 일괄 편집 되돌리기」(`lsp.undoLastEdit`)는 기본 키가 없다 — 액션 찾기와 알림의 [되돌리기].

[[bindings]]
action = "lsp.gotoDeclaration"
mac = "cmd+b"
win = "ctrl+b"
linux = "ctrl+b"
when = "editorFocus"

[[bindings]]
action = "lsp.gotoImplementation"
mac = "cmd+alt+b"
win = "ctrl+alt+b"
linux = "ctrl+alt+b"
when = "editorFocus"

[[bindings]]
action = "lsp.findUsages"
key = "alt+f7"
when = "editorFocus"

[[bindings]]
action = "lsp.quickDocumentation"
mac = "f1"
win = "ctrl+q"
linux = "ctrl+q"
when = "editorFocus"

[[bindings]]
action = "lsp.rename"
key = "shift+f6"
when = "editorFocus"

[[bindings]]
action = "lsp.codeActions"
key = "alt+enter"
when = "editorFocus"

# 진단(10-ui §4.2 「코드」 · 15-m4-plan M4-06, src/lsp/problems.tsx): 파일 안 다음 · 이전 오류(오류가 없으면 경고 · 정보 · 힌트)로
# 커서를 옮기고 그 진단 팝업을 연다. 글자 영역(`editorFocus`)에서만 — 다른 곳의 F2 와 겹치지 않는다(⌘F2 는 실행 중지 · 쿼리 취소).

[[bindings]]
action = "editor.nextError"
key = "f2"
when = "editorFocus"

[[bindings]]
action = "editor.previousError"
key = "shift+f2"
when = "editorFocus"

# 멀티 커서(10-ui §4.2 「멀티 커서」 · §5.3, 15-m4-plan M4-14, src/editor/multi-cursor-actions.ts). 글자 영역(`editorFocus`)에서만 돈다.
# 위 · 아래 줄에 커서 추가는 「수정 키 더블 탭 후 누른 채」(packages/keymap 의 `doubleHold`)다 — macOS `⌥⌥` 를 누른 채 `↑` `↓`,
# Win/Linux `Ctrl Ctrl` 을 누른 채. 수정 키를 떼면 끝나 다음 `⌥↓` 는 보통 키다. Esc 는 툴 윈도우의 「에디터로 포커스」
# (`toolWindowFocus`)와 범위가 갈리고, 찾기 막대 안의 Esc 는 막대가 닫는다.
# 마우스(⌥+드래그 사각 선택 · ⌥⇧+클릭 커서 추가)는 키맵이 아니라 에디터 확장이다(src/editor/extensions/multi-cursor.ts).

[[bindings]]
action = "editor.selectNextOccurrence"
mac = "ctrl+g"
win = "alt+j"
linux = "alt+j"
when = "editorFocus"

[[bindings]]
action = "editor.unselectOccurrence"
mac = "ctrl+shift+g"
win = "alt+shift+j"
linux = "alt+shift+j"
when = "editorFocus"

[[bindings]]
action = "editor.selectAllOccurrences"
mac = "ctrl+cmd+g"
win = "ctrl+alt+shift+j"
linux = "ctrl+alt+shift+j"
when = "editorFocus"

[[bindings]]
action = "editor.addCursorAbove"
mac = "alt alt+up"
win = "ctrl ctrl+up"
linux = "ctrl ctrl+up"
when = "editorFocus"

[[bindings]]
action = "editor.addCursorBelow"
mac = "alt alt+down"
win = "ctrl ctrl+down"
linux = "ctrl ctrl+down"
when = "editorFocus"

[[bindings]]
action = "editor.toggleColumnMode"
mac = "cmd+shift+8"
win = "alt+shift+insert"
linux = "alt+shift+insert"
when = "editorFocus"

[[bindings]]
action = "editor.singleCursor"
key = "escape"
when = "editorFocus"

# 코드 (LSP · 편집) — 자동완성 · 시그니처 도움말(10-ui §4.2, 15-m4-plan M4-11, src/lsp/completion-actions.ts). 글자 영역(`editorFocus`)
# 에서만 돈다. macOS 의 자동완성은 키가 둘이다: ⌃Space(IntelliJ)와 ⌥Space — 입력 소스가 둘 이상이면 macOS 가 ⌃Space 를 먼저
# 가져가 앱에 오지 않는다(한글 자판을 쓰는 기본 설정). ⌥Space 는 IntelliJ 의 「빠른 정의」 키와 겹친다(10-ui §4.2 아래 문단).
# 완성 목록 · 시그니처 팝업 안의 ↑ ↓ ↩ ⇥ Esc 는 키맵이 아니라 에디터 확장이다(src/lsp/completion.ts).

[[bindings]]
action = "editor.completion"
mac = "ctrl+space"
win = "ctrl+space"
linux = "ctrl+space"
when = "editorFocus"

[[bindings]]
action = "editor.completion"
mac = "alt+space"
when = "editorFocus"

[[bindings]]
action = "editor.parameterInfo"
mac = "cmd+p"
win = "ctrl+p"
linux = "ctrl+p"
when = "editorFocus"
