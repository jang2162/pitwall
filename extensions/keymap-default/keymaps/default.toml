# Pitwall 기본 키맵(docs/design/10-ui.md §4.1 · §4.2 — IntelliJ 기본 키맵 기준).
# 형식은 packages/keymap/src/keymap-file.ts 머리 주석. OS별 표기: mac = IntelliJ macOS, win · linux = IntelliJ Windows.
# 지금 실행할 수 있는 액션만 둔다 — 기능이 생길 때 그 액션의 키를 §4.2 표에서 옮겨 온다.
schema = 1

# 검색 · 이동

[[bindings]]
action = "action.find"
mac = "cmd+shift+a"
win = "ctrl+shift+a"
linux = "ctrl+shift+a"

# Search Everywhere 와 그 탭(src/search-everywhere, 결정 M1-D18). 액션 찾기(⌘⇧A)도 같은 팝업의 액션 탭이다. 파일로 이동 · 최근 파일 ·
# 프로젝트 스위처는 프로젝트 창에만 등록된다.
[[bindings]]
action = "search.everywhere"
key = "shift shift"

[[bindings]]
action = "search.gotoFile"
mac = "cmd+shift+o"
win = "ctrl+shift+n"
linux = "ctrl+shift+n"

[[bindings]]
action = "search.recentFiles"
mac = "cmd+e"
win = "ctrl+e"
linux = "ctrl+e"

[[bindings]]
action = "project.switcher"
mac = "cmd+shift+p"
win = "ctrl+shift+p"
linux = "ctrl+shift+p"

# 전체에서 찾기(10-ui §4.2, src/search/find-in-files.tsx). 프로젝트 창에만 등록된다.
[[bindings]]
action = "search.findInFiles"
mac = "cmd+shift+f"
win = "ctrl+shift+f"
linux = "ctrl+shift+f"

# 내비게이션 기록(M4-09, src/editor/navigation-ui.tsx — 10-ui §4.2 「검색 · 이동」): 뒤로 · 앞으로 · 최근 위치. 에디터가 있는 창
# (프로젝트 · 파일 창)에 등록된다. 터미널에 포커스가 있으면 셸로 간다(src/terminal/terminal-keys.ts 의 창 단위 액션이 아니다).
[[bindings]]
action = "navigate.back"
mac = "cmd+["
win = "ctrl+alt+left"
linux = "ctrl+alt+left"

[[bindings]]
action = "navigate.forward"
mac = "cmd+]"
win = "ctrl+alt+right"
linux = "ctrl+alt+right"

[[bindings]]
action = "navigate.recentLocations"
mac = "cmd+shift+e"
win = "ctrl+shift+e"
linux = "ctrl+shift+e"

# 파일 구조 팝업(M4-10, src/structure/file-structure-popup.tsx — 10-ui §4.2 「검색 · 이동」). 에디터가 있는 창에 등록되고, 파일 창
# (프로젝트가 없다)에서는 비활성이라 키를 가져가지 않는다.
[[bindings]]
action = "navigate.fileStructure"
mac = "cmd+f12"
win = "ctrl+f12"
linux = "ctrl+f12"

# 프로젝트 · 웰컴 창(10-ui §2.1 · §2.3). 웰컴 창에만 등록되는 액션이라 다른 창의 같은 키와 부딪히지 않는다(registry.ts 머리 주석).

[[bindings]]
action = "project.new"
mac = "cmd+n"
win = "ctrl+n"
linux = "ctrl+n"

[[bindings]]
action = "project.openFolder"
mac = "cmd+o"
win = "ctrl+o"
linux = "ctrl+o"

[[bindings]]
action = "project.removeFromList"
mac = "cmd+backspace"
win = "delete"
linux = "delete"

[[bindings]]
action = "project.create"
mac = "cmd+enter"
win = "ctrl+enter"
linux = "ctrl+enter"

# 외부 도구(10-ui 「외부 도구 · 프로젝트」, 04 F8-4). 프로젝트 창과 웰컴 창(고른 프로젝트)에 등록된다.

[[bindings]]
action = "openWith.popup"
mac = "alt+f1"
win = "alt+f1"
linux = "alt+f1"

[[bindings]]
action = "openWith.default"
mac = "cmd+alt+e"
win = "ctrl+alt+e"
linux = "ctrl+alt+e"

# 툴 윈도우 · 창

[[bindings]]
action = "toolWindow.project"
mac = "cmd+1"
win = "alt+1"
linux = "alt+1"

[[bindings]]
action = "toolWindow.commit"
mac = "cmd+0"
win = "alt+0"
linux = "alt+0"

[[bindings]]
action = "toolWindow.git"
mac = "cmd+9"
win = "alt+9"
linux = "alt+9"

[[bindings]]
action = "toolWindow.run"
mac = "cmd+4"
win = "alt+4"
linux = "alt+4"

[[bindings]]
action = "toolWindow.debug"
mac = "cmd+5"
win = "alt+5"
linux = "alt+5"

[[bindings]]
action = "toolWindow.problems"
mac = "cmd+6"
win = "alt+6"
linux = "alt+6"

[[bindings]]
action = "toolWindow.structure"
mac = "cmd+7"
win = "alt+7"
linux = "alt+7"

[[bindings]]
action = "toolWindow.database"
mac = "cmd+8"
win = "alt+8"
linux = "alt+8"

[[bindings]]
action = "toolWindow.terminal"
mac = "alt+f12"
win = "alt+f12"
linux = "alt+f12"

[[bindings]]
action = "toolWindow.hideAll"
mac = "cmd+shift+f12"
win = "ctrl+shift+f12"
linux = "ctrl+shift+f12"

[[bindings]]
action = "toolWindow.last"
key = "f12"

# 레이아웃 프리셋(M2-21 · M3-20, 10-ui §2.4 「프로젝트 창」, src/layout/project-layout.ts 의 `applyPreset`): ⌃⌥1 기본 · ⌃⌥2 Git 리뷰 ·
# ⌃⌥3 DB. 터미널에 포커스가 있어도 앱이 받는다(src/terminal/terminal-keys.ts 의 창 단위 액션).
[[bindings]]
action = "layout.preset.default"
mac = "ctrl+alt+1"
win = "ctrl+alt+1"
linux = "ctrl+alt+1"

[[bindings]]
action = "layout.preset.gitReview"
mac = "ctrl+alt+2"
win = "ctrl+alt+2"
linux = "ctrl+alt+2"

[[bindings]]
action = "layout.preset.db"
mac = "ctrl+alt+3"
win = "ctrl+alt+3"
linux = "ctrl+alt+3"

# 「에디터로 포커스」(src/keymap/actions.ts)는 툴 윈도우에 포커스가 있고 입력 칸이 아닐 때만 — 에디터의 찾기 막대 · 팝업 · 파일 트리의
# 빠른 검색 칸이 Esc 로 닫히는 것과 겹치지 않는다. 터미널의 Esc 는 셸로 간다(터미널이 창으로 넘기는 액션이 아니다,
# src/terminal/terminal-keys.ts). 한글 조합 중의 Esc 는 키맵이 보지 않는다(조합 취소만, 10-ui §4.4).
[[bindings]]
action = "editor.focus"
key = "escape"
when = "toolWindowFocus && !inputFocus"

# 툴 윈도우 크기 조절(10-ui 「툴 윈도우 · 창」). 툴 윈도우에 포커스가 있고 입력 칸이 아닐 때만 — Win/Linux 의 Ctrl+Shift+←→ 는
# 에디터와 입력 칸(파일 트리의 빠른 검색 · 터미널 탭 이름 등)의 단어 선택이다. 터미널 본문(xterm 의 입력 칸)에서도 셸로 간다 — TUI
# 편집기의 단어 선택 · 셸 바인딩이 받는다. macOS 의 ⌃⌥⇧ 도 같은 규칙이다.
[[bindings]]
action = "toolWindow.stretchLeft"
mac = "ctrl+alt+shift+left"
win = "ctrl+shift+left"
linux = "ctrl+shift+left"
when = "toolWindowFocus && !inputFocus"

[[bindings]]
action = "toolWindow.stretchRight"
mac = "ctrl+alt+shift+right"
win = "ctrl+shift+right"
linux = "ctrl+shift+right"
when = "toolWindowFocus && !inputFocus"

[[bindings]]
action = "toolWindow.stretchUp"
mac = "ctrl+alt+shift+up"
win = "ctrl+shift+up"
linux = "ctrl+shift+up"
when = "toolWindowFocus && !inputFocus"

[[bindings]]
action = "toolWindow.stretchDown"
mac = "ctrl+alt+shift+down"
win = "ctrl+shift+down"
linux = "ctrl+shift+down"
when = "toolWindowFocus && !inputFocus"

# 에디터 탭(10-ui §4.2 「툴 윈도우 · 창」 · 「검색 · 이동」, src/editor/editor-actions.ts). ⌘⌥W 는 Win/Linux 기본 키가 없다(표의 「—」).
# macOS 의 ⌘W 는 `window.close` 다 — 에디터 탭이 있으면 탭, 없으면 창을 닫는다(10-ui §5.2). 네이티브 메뉴 「닫기」 가 같은 액션이라
# 키와 메뉴 accelerator 가 한 액션으로 모인다(src-tauri/src/menu.rs). Win/Linux 의 창 닫기는 OS 의 Alt+F4 다.

[[bindings]]
action = "window.close"
mac = "cmd+w"

# ⌘S 는 활성 탭의 문서를 저장한다(자동 저장 없음, 결정 M1-D13). 네이티브 메뉴 「저장」 이 같은 액션이라 키와 메뉴 accelerator 가
# 한 액션으로 모인다(src-tauri/src/menu.rs). 「모두 저장」(editor.saveAll)은 기본 키가 없다.
[[bindings]]
action = "editor.save"
mac = "cmd+s"
win = "ctrl+s"
linux = "ctrl+s"

[[bindings]]
action = "editor.closeTab"
win = "ctrl+f4"
linux = "ctrl+f4"

[[bindings]]
action = "editor.closeOtherTabs"
mac = "cmd+alt+w"

[[bindings]]
action = "editor.splitRight"
mac = "cmd+backslash"
win = "ctrl+backslash"
linux = "ctrl+backslash"

[[bindings]]
action = "editor.switcher"
mac = "ctrl+tab"
win = "ctrl+tab"
linux = "ctrl+tab"

# 에디터 조작(10-ui §4.2 「검색 · 이동」 · 「코드」, src/editor/editor-ops.ts). 편집 키 · 줄로 이동은 글자 영역(`editorFocus`)에서만, 찾기 ·
# 바꾸기는 찾기 막대 안(`editorFind`)에서도 돈다 — 찾기 칸의 ⌘⌫ 는 글자를 지우고, 웰컴 창의 ⌘⌫(목록에서 제거) · 터미널의 같은 키와
# 겹치지 않는다. Win/Linux 의 Ctrl+Y 는 IntelliJ 대로 줄 삭제다(redo 는 Ctrl+Shift+Z).
#
# undo · redo 는 `when` 이 없다 — 조건 있는 키는 네이티브 메뉴에 accelerator 로 가지 않는데(packages/keymap `menuAccelerators`),
# Win/Linux 의 Edit 메뉴 「실행 취소」 · 「실행 복귀」 가 이 액션이라 메뉴에 키가 보여야 한다(src-tauri/src/menu.rs). 대신 액션이 포커스가
# 에디터 밖의 입력 칸(찾기 막대 · 대화상자 · 터미널)에 있으면 꺼져 키를 그 칸에 둔다(src/editor/editor-ops.ts).

[[bindings]]
action = "editor.undo"
mac = "cmd+z"
win = "ctrl+z"
linux = "ctrl+z"

[[bindings]]
action = "editor.redo"
mac = "cmd+shift+z"
win = "ctrl+shift+z"
linux = "ctrl+shift+z"

[[bindings]]
action = "editor.find"
mac = "cmd+f"
win = "ctrl+f"
linux = "ctrl+f"
when = "editorFocus || editorFind"

[[bindings]]
action = "editor.replace"
mac = "cmd+r"
win = "ctrl+r"
linux = "ctrl+r"
when = "editorFocus || editorFind"

[[bindings]]
action = "editor.gotoLine"
mac = "cmd+l"
win = "ctrl+g"
linux = "ctrl+g"
when = "editorFocus"

# hex 뷰어의 오프셋으로 이동(M1-23, src/editor/hex-viewer.tsx). 줄로 이동과 같은 키지만 hex 뷰어의 키맵 컨텍스트는 `hexFocus` 하나라
# (포커스에서 가장 가까운 `data-keymap-context` 만 본다, src/keymap/context.ts) 두 `when` 이 함께 참이 되는 일이 없다.
