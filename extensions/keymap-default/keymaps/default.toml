# Pitwall 기본 키맵(docs/design/10-ui.md §4.1 · §4.2 — IntelliJ 기본 키맵 기준).
# 형식은 packages/keymap/src/keymap-file.ts 머리 주석. OS별 표기: mac = IntelliJ macOS, win · linux = IntelliJ Windows.
# 지금 실행할 수 있는 액션만 둔다 — 기능이 생길 때 그 액션의 키를 §4.2 표에서 옮겨 온다.
schema = 1

# 검색 · 이동

[[bindings]]
action = "action.find"
mac = "cmd+shift+a"
win = "ctrl+shift+a"
linux = "ctrl+shift+a"

# 전체에서 찾기(10-ui §4.2, src/search/find-in-files.tsx). 프로젝트 창에만 등록된다.
[[bindings]]
action = "search.findInFiles"
mac = "cmd+shift+f"
win = "ctrl+shift+f"
linux = "ctrl+shift+f"

# 프로젝트 · 웰컴 창(10-ui §2.1 · §2.3). 웰컴 창에만 등록되는 액션이라 다른 창의 같은 키와 부딪히지 않는다(registry.ts 머리 주석).

[[bindings]]
action = "project.new"
mac = "cmd+n"
win = "ctrl+n"
linux = "ctrl+n"

[[bindings]]
action = "project.openFolder"
mac = "cmd+o"
win = "ctrl+o"
linux = "ctrl+o"

[[bindings]]
action = "project.removeFromList"
mac = "cmd+backspace"
win = "delete"
linux = "delete"

[[bindings]]
action = "project.create"
mac = "cmd+enter"
win = "ctrl+enter"
linux = "ctrl+enter"

# 외부 도구(10-ui 「외부 도구 · 프로젝트」, 04 F8-4). 프로젝트 창과 웰컴 창(고른 프로젝트)에 등록된다.

[[bindings]]
action = "openWith.popup"
mac = "alt+f1"
win = "alt+f1"
linux = "alt+f1"

[[bindings]]
action = "openWith.default"
mac = "cmd+alt+e"
win = "ctrl+alt+e"
linux = "ctrl+alt+e"

# 툴 윈도우 · 창

[[bindings]]
action = "toolWindow.project"
mac = "cmd+1"
win = "alt+1"
linux = "alt+1"

[[bindings]]
action = "toolWindow.commit"
mac = "cmd+0"
win = "alt+0"
linux = "alt+0"

[[bindings]]
action = "toolWindow.git"
mac = "cmd+9"
win = "alt+9"
linux = "alt+9"

[[bindings]]
action = "toolWindow.run"
mac = "cmd+4"
win = "alt+4"
linux = "alt+4"

[[bindings]]
action = "toolWindow.debug"
mac = "cmd+5"
win = "alt+5"
linux = "alt+5"

[[bindings]]
action = "toolWindow.problems"
mac = "cmd+6"
win = "alt+6"
linux = "alt+6"

[[bindings]]
action = "toolWindow.structure"
mac = "cmd+7"
win = "alt+7"
linux = "alt+7"

[[bindings]]
action = "toolWindow.database"
mac = "cmd+8"
win = "alt+8"
linux = "alt+8"

[[bindings]]
action = "toolWindow.terminal"
mac = "alt+f12"
win = "alt+f12"
linux = "alt+f12"

[[bindings]]
action = "toolWindow.hideAll"
mac = "cmd+shift+f12"
win = "ctrl+shift+f12"
linux = "ctrl+shift+f12"

# 에디터 탭(10-ui §4.2 「툴 윈도우 · 창」 · 「검색 · 이동」, src/editor/editor-actions.ts). ⌘⌥W 는 Win/Linux 기본 키가 없다(표의 「—」).
# macOS 의 ⌘W 는 `window.close` 다 — 에디터 탭이 있으면 탭, 없으면 창을 닫는다(10-ui §5.2). 네이티브 메뉴 「닫기」 가 같은 액션이라
# 키와 메뉴 accelerator 가 한 액션으로 모인다(src-tauri/src/menu.rs). Win/Linux 의 창 닫기는 OS 의 Alt+F4 다.

[[bindings]]
action = "window.close"
mac = "cmd+w"

# ⌘S 는 활성 탭의 문서를 저장한다(자동 저장 없음, 결정 M1-D13). 네이티브 메뉴 「저장」 이 같은 액션이라 키와 메뉴 accelerator 가
# 한 액션으로 모인다(src-tauri/src/menu.rs). 「모두 저장」(editor.saveAll)은 기본 키가 없다.
[[bindings]]
action = "editor.save"
mac = "cmd+s"
win = "ctrl+s"
linux = "ctrl+s"

[[bindings]]
action = "editor.closeTab"
win = "ctrl+f4"
linux = "ctrl+f4"

[[bindings]]
action = "editor.closeOtherTabs"
mac = "cmd+alt+w"

[[bindings]]
action = "editor.splitRight"
mac = "cmd+backslash"
win = "ctrl+backslash"
linux = "ctrl+backslash"

[[bindings]]
action = "editor.switcher"
mac = "ctrl+tab"
win = "ctrl+tab"
linux = "ctrl+tab"

[[bindings]]
action = "settings.open"
mac = "cmd+,"
win = "ctrl+alt+s"
linux = "ctrl+alt+s"

# 파일 트리(src/file-tree, 10-ui §5.4 · §4.2 「이름 바꾸기」). 트리에 포커스가 있을 때만(`fileTree`) — 에디터의 ⇧F6(M4 LSP 이름 바꾸기)
# · ⌘⌫(줄 삭제)와 범위가 겹치지 않는다. 삭제는 IntelliJ 처럼 macOS 에서 ⌫ 와 ⌦(fn+⌫) 둘 다다.

[[bindings]]
action = "fileTree.rename"
key = "shift+f6"
when = "fileTree"

[[bindings]]
action = "fileTree.delete"
mac = "backspace"
win = "delete"
linux = "delete"
when = "fileTree"

[[bindings]]
action = "fileTree.delete"
mac = "delete"
when = "fileTree"

# 터미널(src/terminal/terminal-keys.ts, 10-ui §4.4 「터미널」). 터미널이 포커스를 가지면 키는 대부분 셸로 가고, `when` 이 `terminalFocus` 를
# 읽는 바인딩과 창 단위 액션만 앱이 받는다. macOS 의 복사 · 붙여넣기는 네이티브 Edit 메뉴의 ⌘C · ⌘V 가 한다. 터미널의 ⌘W 는 탭을 닫는다
# (IntelliJ 와 같다) — 메뉴 「닫기」(`window.close`)가 같은 키라 메뉴로 또 오는 것은 keymap-provider.tsx 의 중복 가드가 버린다.

[[bindings]]
action = "terminal.newTab"
mac = "cmd+t"
win = "ctrl+shift+t"
linux = "ctrl+shift+t"
when = "terminalFocus"

[[bindings]]
action = "terminal.closeTab"
mac = "cmd+w"
win = "ctrl+shift+w"
linux = "ctrl+shift+w"
when = "terminalFocus"

[[bindings]]
action = "terminal.copy"
win = "ctrl+shift+c"
linux = "ctrl+shift+c"
when = "terminalFocus"

[[bindings]]
action = "terminal.paste"
win = "ctrl+shift+v"
linux = "ctrl+shift+v"
when = "terminalFocus"
