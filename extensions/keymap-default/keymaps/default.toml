win = "ctrl+d"
linux = "ctrl+d"
when = "editorFocus"

[[bindings]]
action = "editor.deleteLine"
mac = "cmd+backspace"
win = "ctrl+y"
linux = "ctrl+y"
when = "editorFocus"

[[bindings]]
action = "editor.moveLineUp"
mac = "alt+shift+up"
win = "alt+shift+up"
linux = "alt+shift+up"
when = "editorFocus"

[[bindings]]
action = "editor.moveLineDown"
mac = "alt+shift+down"
win = "alt+shift+down"
linux = "alt+shift+down"
when = "editorFocus"

[[bindings]]
action = "editor.commentLine"
mac = "cmd+slash"
win = "ctrl+slash"
linux = "ctrl+slash"
when = "editorFocus"

[[bindings]]
action = "settings.open"
mac = "cmd+,"
win = "ctrl+alt+s"
linux = "ctrl+alt+s"

# 파일 트리(src/file-tree, 10-ui §5.4 · §4.2 「이름 바꾸기」). 트리에 포커스가 있을 때만(`fileTree`) — 에디터의 ⇧F6(M4 LSP 이름 바꾸기)
# · ⌘⌫(줄 삭제)와 범위가 겹치지 않는다. 삭제는 IntelliJ 처럼 macOS 에서 ⌫ 와 ⌦(fn+⌫) 둘 다다.

