win = "alt+0"
linux = "alt+0"

[[bindings]]
action = "toolWindow.git"
mac = "cmd+9"
win = "alt+9"
linux = "alt+9"

[[bindings]]
action = "toolWindow.run"
mac = "cmd+4"
win = "alt+4"
linux = "alt+4"

[[bindings]]
action = "toolWindow.debug"
mac = "cmd+5"
win = "alt+5"
linux = "alt+5"

[[bindings]]
action = "toolWindow.problems"
mac = "cmd+6"
win = "alt+6"
linux = "alt+6"

[[bindings]]
action = "toolWindow.structure"
mac = "cmd+7"
win = "alt+7"
linux = "alt+7"

[[bindings]]
action = "toolWindow.database"
mac = "cmd+8"
win = "alt+8"
linux = "alt+8"

[[bindings]]
action = "toolWindow.terminal"
mac = "alt+f12"
win = "alt+f12"
