# TypeScript 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-typescript"
name = "TypeScript"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.typescript]
linguist = "TypeScript"
builtin_grammar = "typescript"
queries = "queries/typescript"
line_comment = "//"

# 언어 서버(docs/design/15-m4-plan.md 결정 M4-D1 · D2 · D7). lang-tsx · lang-javascript 의 언어도 이 정의 하나가 맡는다.
# 신뢰한 프로젝트면 프로젝트의 node_modules 에 있는 서버와 typescript(tsserver)를 먼저 쓴다.
[contributes.language_servers.typescript-language-server]
languages = ["typescript", "tsx", "javascript"]
mason = "typescript-language-server"
command = "typescript-language-server"
args = ["--stdio"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
requires = { node = ">=20" }
project_local = "node_modules/.bin/typescript-language-server"
project_local_options = { "tsserver.path" = "node_modules/typescript/lib" }
