# TOML 언어. 앱에 묶이는 내장 확장이다(crates/pw-ext 「내장 확장」). queries/ · LICENSE* 는 생성물이다 —
# 출처표 scripts/grammars.toml 을 고치고 `mise run grammars` 로 다시 만든다.
id = "dev.pitwall.lang-toml"
name = "TOML"
version = "0.1.0"
engines = { pitwall = "*" }
authors = ["Pitwall contributors"]
license = "MIT"

[contributes.languages.toml]
linguist = "TOML"
builtin_grammar = "toml"
queries = "queries/toml"
line_comment = "#"
