[package]
name = "pitwall-relay"
description = "Pitwall relay: the daemon on a remote machine and the stdio proxy an SSH session runs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pitwall-relay"
path = "src/main.rs"

[dependencies]
pw-core = { path = "../../crates/pw-core" }
pw-diag = { path = "../../crates/pw-diag" }
# 원격 git 의 askpass 도우미(`pitwall-relay askpass` — 소켓 · 토큰 환경 · 질문 꼴은 Desktop 의 도우미와 같다, M7-15).
pw-git = { path = "../../crates/pw-git" }
pw-link = { path = "../../crates/pw-link" }
# `pitwall-relay mcp` 의 stdio ↔ MCP 소켓 프록시와 데몬의 MCP 소켓(18-m7-plan M7-20).
pw-mcp = { path = "../../crates/pw-mcp" }
pw-relay = { path = "../../crates/pw-relay" }
# 끝날 때 터미널 · 실행의 프로세스 트리를 끝낸다(`pw_run::shutdown`).
pw-run = { path = "../../crates/pw-run" }
serde_json = { workspace = true }
# `--verify`: 원격에 해시 도구가 없을 때 올린 파일의 sha256(18-m7-plan M7-06 ④). pw-link 와 같은 판이다.
sha2 = "0.11.1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }

[dev-dependencies]
# 시험이 띄운 데몬을 끝낸다(SIGTERM).
libc = "0.2.190"
# 생성물(`TOPICS` · schema)이 Relay 바이너리가 링크한 선언을 덮는지 본다(M7-02 리뷰 권고 3).
pw-rpc = { path = "../../crates/pw-rpc" }
pw-host = { path = "../../crates/pw-host" }
# 설치 · SSH 자동 페어링 시험(tests/bootstrap.rs — 가짜 ssh 로 이 Relay 를 「원격」 에 올린다, M7-06).
pw-link = { path = "../../crates/pw-link", features = ["test-support"] }
pw-release = { path = "../../crates/pw-release" }
# 원격 askpass 시험(tests/askpass.rs — 진짜 git 쓰기 · 시험 원격 도우미, M7-15).
pw-git = { path = "../../crates/pw-git", features = ["test-support"] }
semver = "1.0.28"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
