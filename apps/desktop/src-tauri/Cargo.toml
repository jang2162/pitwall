[package]
name = "pitwall-desktop"
description = "Pitwall desktop app (Tauri shell)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pitwall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
pw-core = { path = "../../../crates/pw-core" }
pw-diag = { path = "../../../crates/pw-diag" }
pw-ext = { path = "../../../crates/pw-ext" }
pw-i18n = { path = "../../../crates/pw-i18n" }
pw-mcp = { path = "../../../crates/pw-mcp" }
pw-open-with = { path = "../../../crates/pw-open-with" }
pw-rpc = { path = "../../../crates/pw-rpc" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tracing = "0.1.44"
# `pitwall mcp` 는 Tauri 를 띄우지 않으므로 자기 런타임을 만든다(io-std: stdio 를 MCP 로 쓴다).
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "time"] }
tokio-util = { workspace = true }
# `pitwall mcp` 의 로그(`$STATE/logs/mcp.<날짜>.log` + stderr 경고). 버전 · 기능은 pw-diag 와 같게 둔다.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }

[dev-dependencies]
# 창 열기 함수를 MockRuntime 위에서 시험한다(tauri::test::mock_app).
tauri = { version = "2.12.3", features = ["test"] }
# IPC 테스트에서 채널 메시지를 기다릴 시간 제한. 언어 변경을 따라가는 시험(src/i18n.rs)은 tokio 런타임에서 돈다.
tokio = { workspace = true, features = ["time", "rt", "macros"] }
# 설정 스토어를 임시 폴더에 열어 크래시 설정 · 설정 오류 로그를 시험한다.
tempfile = "3.27.0"
# 내장 확장만으로 레지스트리를 만든다(Registry::from_roots 가 앱 버전을 받는다).
semver = "1.0.28"

[target."cfg(unix)".dependencies]
libc = "0.2.190"
