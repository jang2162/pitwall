[package]
name = "pitwall-desktop"
description = "Pitwall desktop app (Tauri shell)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "pitwall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
pw-core = { path = "../../../crates/pw-core" }
pw-diag = { path = "../../../crates/pw-diag" }
pw-ext = { path = "../../../crates/pw-ext" }
pw-rpc = { path = "../../../crates/pw-rpc" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tracing = "0.1.44"

[dev-dependencies]
# 창 열기 함수를 MockRuntime 위에서 시험한다(tauri::test::mock_app).
tauri = { version = "2.12.3", features = ["test"] }
# IPC 테스트에서 채널 메시지를 기다릴 시간 제한.
tokio = { workspace = true, features = ["time"] }
# 설정 스토어를 임시 폴더에 열어 크래시 설정 · 설정 오류 로그를 시험한다.
tempfile = "3.27.0"
