[tools]
node = "24.21.0"
"npm:pnpm" = "10.33.0"
rust = "1.99.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:EmbarkStudios/cargo-about" = "0.9.2"
"aqua:rhysd/actionlint" = "1.7.12"

[tasks.install-deps]
description = "Node 의존성 설치(lockfile 고정)"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Rust 워크스페이스 빌드"
run = "cargo build --workspace"

[tasks.test]
description = "Rust(nextest) 와 TS(Vitest) 테스트"
depends = ["install-deps"]
run = ["cargo nextest run --workspace --no-tests=fail", "pnpm -r --if-present run test"]

[tasks.lint]
description = "fmt 검사 + clippy + oxlint + tsc"
depends = ["install-deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "pnpm exec oxfmt --check .",
  "pnpm exec oxlint --deny-warnings",
  "pnpm -r --if-present run typecheck",
  "actionlint",
]

[tasks.fmt]
description = "포맷 적용"
depends = ["install-deps"]
run = ["cargo fmt --all", "pnpm exec oxfmt ."]

[tasks.licenses]
description = "cargo-deny(라이선스·취약점·금지·출처) + npm 라이선스 + THIRD_PARTY_NOTICES.md 최신 여부"
depends = ["install-deps"]
run = [
  "cargo deny check",
  "node scripts/licenses.mjs check",
  "node scripts/licenses.mjs notices --check",
]

[tasks.notices]
description = "THIRD_PARTY_NOTICES.md 생성"
depends = ["install-deps"]
run = "node scripts/licenses.mjs notices"
