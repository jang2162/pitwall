[tools]
node = "24.21.0"
"npm:pnpm" = "10.33.0"
rust = "1.99.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# cargo-about 은 Intel macOS(x86_64-apple-darwin) 릴리스 자산이 없어 소스 빌드로 받는다. 플랫폼마다 백엔드를 가르는
# `os = ["macos/arm64"]` 형식은 여기서 쓰는 mise(2026.4.3)가 모르고 도구를 통째로 건너뛴다. 빌드는 CI 에서 mise-action 캐시가 덮는다.
"cargo:cargo-about" = { version = "0.9.2", features = "cli" }
"aqua:rhysd/actionlint" = "1.7.12"
# actionlint 가 워크플로의 `run:` 스크립트를 검사할 때 부른다. 고정하지 않으면 PATH 의 아무 shellcheck(다른 프로젝트의
# 버전 없는 mise shim 이면 actionlint 가 실패한다)를 집는다.
"aqua:koalaman/shellcheck" = "0.11.0"
# tree-sitter 의 `wasm` 기능이 끌어오는 wasmtime-c-api-impl 의 빌드 스크립트가 C 헤더를 설치하려고 cmake 를 부른다(pw-syntax).
# 고정하지 않으면 PATH 의 아무 cmake(버전 없는 mise shim 이면 빌드가 실패한다)를 집는다.
"aqua:Kitware/CMake" = "4.1.6"
# 내장 언어 확장의 문법 WASM 을 만든다(`mise run grammars`, scripts/grammars.mjs). wasi-sdk · binaryen 은 이 CLI 가 자기 버전에
# 맞춰 받는다. 일반 빌드 · 시험에는 쓰이지 않는다 — 만든 WASM 은 저장소에 있다.
"aqua:tree-sitter/tree-sitter" = "0.27.1"

[tasks.install-deps]
description = "Node 의존성 설치(lockfile 고정)"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Rust 워크스페이스 빌드 + TS 패키지 빌드"
depends = ["install-deps"]
run = ["cargo build --workspace", "pnpm -r --if-present run build"]

[tasks.dev]
description = "데스크톱 앱을 개발 모드로 실행(워크트리 전용 포트)"
depends = ["install-deps"]
run = "node apps/desktop/scripts/dev.mjs"

[tasks.test]
description = "Rust(nextest · doctest) 와 TS(Vitest) 테스트"
depends = ["install-deps"]
# nextest 는 doctest 를 돌리지 않는다. 문서의 사용 예는 cargo test --doc 로 따로 돌린다.
run = [
  "cargo nextest run --workspace --no-tests=fail",
  "cargo test --workspace --doc",
  "pnpm -r --if-present run test",
]

[tasks.lint]
description = "fmt 검사 + clippy + oxlint + tsc + actionlint + 생성물 최신 여부"
depends = ["install-deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "pnpm exec oxfmt --check .",
  "pnpm exec oxlint --deny-warnings",
  "pnpm -r --if-present run typecheck",
  "actionlint",
  # 생성물(packages/rpc-client)이 RPC 선언과 맞는지. 쓰지 않고 비교만 한다 — 고치려면 `mise run gen`.
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen -- --check",
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen-fixtures -- --check",
  # 내장 언어 확장의 문법 WASM · 쿼리가 출처표(scripts/grammars.toml)의 해시와 맞는지. 고치려면 `mise run grammars`.
  "node scripts/grammars.mjs check",
]

# 데스크톱 앱 release 번들을 만들고 콜드 스타트 · 유휴 메모리를 잰다(macOS). 측정 방법은 CONTRIBUTING.md 「성능 기준선」 절.
# 프로젝트 창이 회마다 한 번 뜬다. 인자는 마지막 명령(pw-perf)에 붙는다 — 예: `mise run perf -- --runs 3`.
[tasks.perf]
description = "release 번들의 콜드 스타트 · 유휴 메모리 측정(macOS, 결과는 target/perf/)"
depends = ["install-deps"]
run = [
  "pnpm --filter @pitwall/desktop tauri build --bundles app",
  "cargo run -q --release -p pw-perf -- --app target/release/bundle/macos/Pitwall.app",
]

# Linguist `samples/`(36MB, 저장소에 넣지 않는다)를 고정 커밋에서 받아 pw-lang 의 일치율 시험을 돌린다(네트워크 필요).
# 받은 samples 는 target/linguist-samples/<커밋>/ 에 두고 다시 받지 않는다. 기본 `test` 에서는 빠진다(`#[ignore]`).
[tasks.lang-samples]
description = "Linguist samples 일치율 시험(samples 를 GitHub 에서 받는다)"
run = "node scripts/linguist.mjs samples-test"

# 내장 언어 확장(extensions/lang-*)의 문법 WASM · 강조 쿼리를 출처표 scripts/grammars.toml 의 고정 커밋에서 다시 만든다(네트워크 ·
# tree-sitter CLI 필요). 인자로 문법 id 를 주면 그것만. 순서와 규칙은 CONTRIBUTING.md 「tree-sitter 문법」 절.
[tasks.grammars]
description = "내장 언어 확장의 tree-sitter 문법 WASM · 쿼리 다시 만들기(출처표 scripts/grammars.toml)"
run = "node scripts/grammars.mjs build"

[tasks.gen]
description = "RPC 선언에서 TS 타입 · JSON Schema · 클라이언트 테스트 고정 입력 생성(packages/rpc-client)"
run = [
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen",
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen-fixtures",
]

[tasks.fmt]
description = "포맷 적용"
depends = ["install-deps"]
run = ["cargo fmt --all", "pnpm exec oxfmt ."]

# 취약점 공지(advisories)는 `advisories` 로 따로 둔다. 새 공지는 그 PR 의 변경과 무관하게 올라오므로 CI 에서 PR 을
# 막지 않게 다룬다(.github/workflows/ci.yml 의 advisories 잡). licenses 는 오프라인으로 돌고 PR 을 막는다.
[tasks.licenses]
description = "cargo-deny(라이선스·금지·출처) + npm 라이선스 + THIRD_PARTY_NOTICES.md 최신 여부"
depends = ["install-deps"]
run = [
  "cargo deny check licenses bans sources",
  "node scripts/licenses.mjs check",
  "node scripts/licenses.mjs notices --check",
]

[tasks.notices]
description = "THIRD_PARTY_NOTICES.md 생성"
depends = ["install-deps"]
run = "node scripts/licenses.mjs notices"

[tasks.advisories]
description = "cargo-deny 취약점·관리 중단 공지 검사(RustSec 데이터베이스를 네트워크로 받는다)"
run = "cargo deny check advisories"
