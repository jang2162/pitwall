[tools]
node = "24.21.0"
"npm:pnpm" = "10.33.0"
rust = "1.99.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# cargo-about 은 Intel macOS(x86_64-apple-darwin) 릴리스 자산이 없어 소스 빌드로 받는다. 플랫폼마다 백엔드를 가르는
# `os = ["macos/arm64"]` 형식은 여기서 쓰는 mise(2026.4.3)가 모르고 도구를 통째로 건너뛴다. 빌드는 CI 에서 mise-action 캐시가 덮는다.
"cargo:cargo-about" = { version = "0.9.2", features = "cli" }
"aqua:rhysd/actionlint" = "1.7.12"
# actionlint 가 워크플로의 `run:` 스크립트를 검사할 때 부른다. 고정하지 않으면 PATH 의 아무 shellcheck(다른 프로젝트의
# 버전 없는 mise shim 이면 actionlint 가 실패한다)를 집는다.
"aqua:koalaman/shellcheck" = "0.11.0"
# tree-sitter 의 `wasm` 기능이 끌어오는 wasmtime-c-api-impl 의 빌드 스크립트가 C 헤더를 설치하려고 cmake 를 부른다(pw-syntax 의
# `wasm` 기능 — 앱 빌드는 켜지 않고 `mise run test` · `lint` 가 `--all-features` 로 켠다). 고정하지 않으면 PATH 의 아무 cmake(버전
# 없는 mise shim 이면 빌드가 실패한다)를 집는다.
"aqua:Kitware/CMake" = "4.1.6"
# WASM 문법 경로의 시험 입력(crates/pw-syntax/tests/wasm/)을 만든다(`mise run grammars`, scripts/grammars.mjs). wasi-sdk ·
# binaryen 은 이 CLI 가 자기 버전에 맞춰 받는다. 일반 빌드 · 시험에는 쓰이지 않는다 — 만든 WASM 은 저장소에 있다.
"aqua:tree-sitter/tree-sitter" = "0.27.1"

[tasks.install-deps]
description = "Node 의존성 설치(lockfile 고정)"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Rust 워크스페이스 빌드 + TS 패키지 빌드"
depends = ["install-deps"]
run = ["cargo build --workspace", "pnpm -r --if-present run build"]

[tasks.dev]
description = "데스크톱 앱을 개발 모드로 실행(워크트리 전용 포트)"
depends = ["install-deps"]
run = "node apps/desktop/scripts/dev.mjs"

[tasks.test]
description = "Rust(nextest · doctest) 와 TS(Vitest) 테스트"
depends = ["install-deps"]
# nextest 는 doctest 를 돌리지 않는다. 문서의 사용 예는 cargo test --doc 로 따로 돌린다. `--all-features` 는 앱이 켜지 않는 기능의
# 코드도 시험한다(pw-syntax 의 `wasm` — 외부 확장의 문법 WASM 경로).
run = [
  "cargo nextest run --workspace --all-features --no-tests=fail",
  "cargo test --workspace --all-features --doc",
  "pnpm -r --if-present run test",
  # 실기 측정 스크립트(scripts/perf-m2.mjs)의 종료 코드 · 복사 이름 · 덮어쓰기 · 잠금 확인 — 가짜 mise 로 앱 없이 돈다.
  "node --test scripts/perf-m2.test.mjs",
  # 실 DB 시험 실행 개수 검사(scripts/db-live.mjs)의 판정 — 실 DB 없이 돈다.
  "node --test scripts/db-live.test.mjs",
]

# 실 DB 시험(live_*)을 DB 마다 따로 돌리고 실행 개수를 하한(scripts/db-live.toml)과 견준다 — CI 의 `db-live` 잡과 같은 명령이다.
# URL(PW_TEST_PG_URL · PW_TEST_MYSQL_URL · PW_TEST_MARIADB_URL · PW_TEST_REDIS_URL)이 없는 DB 는 건너뛰고 그렇게 알린다 — 통과로
# 세지 않는다(모두 건너뛰면 종료 코드 3). 인자로 DB 를 고른다 — 예: `mise run test-db -- pg redis`.
[tasks.test-db]
description = "실 DB 시험(PG · MySQL · MariaDB · Redis)을 DB 마다 돌리고 실행 개수 하한 검사(URL 이 없는 DB 는 건너뜀)"
run = "node scripts/db-live.mjs"

# 「release 빌드에서만 판정」하는 시험을 모아 돈다 — 기본 `test` 는 debug 라 시간 상한(검색 취소 100 ms · `fs.list` 1만 개 100 ms ·
# 구문 강조 16 ms)을 판정하지 않는다. `--run-ignored all` 은 release 전용 `#[ignore]` 시험도 포함한다. 벽시계를 재므로 `-j 1`,
# 문법 WASM 경로(`wasm` 기능)는 앱과 같게 켜지 않는다. 시험 목록을 바꾸면 CONTRIBUTING.md 「명령」 도 맞춘다.
[tasks.test-release]
description = "release 에서만 판정하는 시간 상한 시험(검색 취소 · fs.list · 구문 강조 · git 감시 이벤트 · 상태바 브랜치 · SQL 문장 나누기)"
depends = ["install-deps"]
run = "cargo nextest run --release -p pw-fs -p pw-syntax -p pw-git -p pw-db-sql --no-tests=fail -j 1 --run-ignored all -E 'test(/^search::tests::stopping_/) | test(=search::tests::the_stream_sends_files_then_done_and_ends_soon_after_cancel) | test(=tests::list_of_10000_entries_is_fast_in_release) | test(=a_5000_line_rust_file_highlights_within_budget) | test(=tests::watch::terminal_git_actions_raise_the_matching_events_and_the_reads_follow) | test(=tests::watch::a_branch_made_in_the_main_checkout_reaches_a_linked_worktree) | test(=tests::watch::the_status_bar_follows_a_terminal_checkout_on_one_shared_watch) | test(=split::tests::a_1mib_script_of_10000_statements_splits_within_50ms) | test(=split::tests::a_long_delimiter_keeps_the_split_linear)'"

[tasks.lint]
description = "fmt 검사 + clippy + oxlint + tsc + actionlint + 생성물 최신 여부"
depends = ["install-deps"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "pnpm exec oxfmt --check .",
  "pnpm exec oxlint --deny-warnings",
  "pnpm -r --if-present run typecheck",
  "actionlint",
  # 생성물(packages/rpc-client)이 RPC 선언과 맞는지. 쓰지 않고 비교만 한다 — 고치려면 `mise run gen`.
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen -- --check",
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen-fixtures -- --check",
  # 내장 언어 확장의 쿼리 · 저장소에 넣은 문법 파일이 출처표(scripts/grammars.toml)의 해시와, 문법 크레이트 판본이 Cargo.lock 과
  # 맞는지. 고치려면 `mise run grammars`.
  "node scripts/grammars.mjs check",
]

# 데스크톱 앱 release 번들을 만들고 콜드 스타트 · 유휴 메모리를 잰다(macOS). 측정 방법은 CONTRIBUTING.md 「성능 기준선」 절.
# 프로젝트 창이 회마다 한 번 뜬다. 인자는 마지막 명령(pw-perf)에 붙는다 — 예: `mise run perf -- --runs 3`.
[tasks.perf]
description = "release 번들의 콜드 스타트 · 유휴 메모리 측정(macOS, 결과는 target/perf/)"
depends = ["install-deps"]
run = [
  "pnpm --filter @pitwall/desktop tauri build --bundles app",
  "cargo run -q --release -p pw-perf -- --app target/release/bundle/macos/Pitwall.app",
]

# git 시나리오(M2-13 · M2-14 · M2-15 · M2-16 · M2-17)의 합성 10만 커밋 저장소 둘을 만든다: target/perf-git/graph(commit-graph 있음) ·
# no-graph(없음). 둘 다 1만 줄 diff 커밋 · 고칠 파일 1만 개 · 타이핑 대상 파일과 체크아웃용 브랜치(`synth_history --perf-fixture`)가
# 든다. 픽스처 브랜치와 타이핑 대상 파일이 있는 저장소는 다시 만들지 않는다 — 만들다 멈춘 폴더(브랜치가 없다)와 옛 픽스처(타이핑
# 대상이 없다)는 지우고 다시 만든다. 처음에는 저장소마다 10~55초.
[tasks.perf-git-repos]
description = "git 시나리오의 합성 10만 커밋 저장소 둘(target/perf-git/, commit-graph 있음 · 없음)"
run = """
set -eu
for kind in graph no-graph; do
  dir="target/perf-git/$kind"
  if git -C "$dir" rev-parse -q --verify refs/heads/perf-checkout >/dev/null 2>&1 \
    && git -C "$dir" cat-file -e main:perf/typing.rs >/dev/null 2>&1; then
    echo "$dir: ready"
    continue
  fi
  rm -rf "$dir"
  flag=""
  if [ "$kind" = graph ]; then flag="--commit-graph"; fi
  cargo run -q --release -p pw-git --features test-support --example synth_history -- "$dir" 100000 --perf-fixture $flag
done
"""

# release 번들에서 git 시나리오(⌘9 첫 그림 · 10만 행 스크롤 · 1만 줄 diff · 체크아웃 → 상태바 · 거터 수정 표시 · 30초 타이핑 · 1만 파일
# 커밋 목록 스크롤 · git add → 그룹 이동)를 저장소 둘 × (준비 1 + 측정 5)회 잰다(macOS). 측정 방법은 CONTRIBUTING.md 「성능 기준선」 의
# 「git 시나리오」. 프로젝트 창이 회마다 한 번 앞에 뜬다(기본 12번) — OS 키 입력은 보내지 않는다. 인자는 마지막 명령(pw-perf)에 붙는다
# — 예: `mise run perf-git -- --runs 3`.
[tasks.perf-git]
description = "release 번들의 git 시나리오 측정(macOS, 결과는 target/perf/)"
depends = ["install-deps", "perf-git-repos"]
run = [
  "pnpm --filter @pitwall/desktop tauri build --bundles app",
  "cargo run -q --release -p pw-perf -- --app target/release/bundle/macos/Pitwall.app --git-repo target/perf-git/graph --git-repo target/perf-git/no-graph",
]

# M2-22 실기 측정 한 번에: perf-git 과 `perf --project target/perf-git/graph` 를 차례로 돌리고 결과를 docs/superpowers/reports/ 로
# 복사한다. `mise run perf-m2 -- --short` 는 둘 다 1회(끝까지 도는지만). 앱이 앞으로 뜨므로 사람이 기기를 비웠을 때만 —
# 절차는 docs/ops/m2-realcheck.md.
[tasks.perf-m2]
description = "M2-22 실기 측정(perf-git + git 저장소 프로젝트의 콜드 스타트 · 유휴 메모리)을 돌리고 결과를 보고서 폴더로 복사"
depends = ["perf-git-repos"]
run = "node scripts/perf-m2.mjs"

# Linguist `samples/`(36MB, 저장소에 넣지 않는다)를 고정 커밋에서 받아 pw-lang 의 일치율 시험을 돌린다(네트워크 필요).
# 받은 samples 는 target/linguist-samples/<커밋>/ 에 두고 다시 받지 않는다. 기본 `test` 에서는 빠진다(`#[ignore]`).
[tasks.lang-samples]
description = "Linguist samples 일치율 시험(samples 를 GitHub 에서 받는다)"
run = "node scripts/linguist.mjs samples-test"

# 내장 언어 확장(extensions/lang-*)의 강조 쿼리와 저장소에 넣는 문법 파일(C 소스 · 시험용 WASM)을 출처표 scripts/grammars.toml 의
# 고정 커밋에서 다시 만든다(네트워크 · 시험용 WASM 은 tree-sitter CLI 필요). 인자로 문법 id 를 주면 그것만. 순서와 규칙은
# CONTRIBUTING.md 「tree-sitter 문법」 절.
[tasks.grammars]
description = "내장 언어 확장의 tree-sitter 쿼리 · 넣은 문법 파일 다시 만들기(출처표 scripts/grammars.toml)"
run = "node scripts/grammars.mjs build"

[tasks.gen]
description = "RPC 선언에서 TS 타입 · JSON Schema · 클라이언트 테스트 고정 입력 생성(packages/rpc-client)"
run = [
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen",
  "cargo run -q -p pw-rpc-gen --bin pw-rpc-gen-fixtures",
]

[tasks.fmt]
description = "포맷 적용"
depends = ["install-deps"]
run = ["cargo fmt --all", "pnpm exec oxfmt ."]

# 취약점 공지(advisories)는 `advisories` 로 따로 둔다. 새 공지는 그 PR 의 변경과 무관하게 올라오므로 CI 에서 PR 을
# 막지 않게 다룬다(.github/workflows/ci.yml 의 advisories 잡). licenses 는 오프라인으로 돌고 PR 을 막는다.
[tasks.licenses]
description = "cargo-deny(라이선스·금지·출처) + npm 라이선스 + THIRD_PARTY_NOTICES.md 최신 여부"
depends = ["install-deps"]
run = [
  "cargo deny check licenses bans sources",
  "node scripts/licenses.mjs check",
  "node scripts/licenses.mjs notices --check",
]

[tasks.notices]
description = "THIRD_PARTY_NOTICES.md 생성"
depends = ["install-deps"]
run = "node scripts/licenses.mjs notices"

[tasks.advisories]
description = "cargo-deny 취약점·관리 중단 공지 검사(RustSec 데이터베이스를 네트워크로 받는다)"
run = "cargo deny check advisories"
